<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Mitra | Asdar Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; height: 100vh; display: flex; align-items: center; }
        .card { background: #5df549; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; width: 100%; max-width: 400px; }
        .form-control { background: #97aee4; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; }
        .form-control:focus { background: #5269a4; color: white; border-color: #3b82f6; box-shadow: none; }
        .btn-primary { background: #3b82f6; border: none; padding: 12px; font-weight: 700; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="card p-4 shadow-lg">
            <div class="text-center mb-4">
                <h3 class="fw-bold">Daftar <span class="text-primary">Mitra</span></h3>
                <p class="text-muted small">Bergabung untuk mendapatkan harga khusus reseller</p>
            </div>

            <div class="mb-3">
                <label class="small mb-1">Nama Lengkap</label>
                <input type="text" id="reg-name" class="form-control" placeholder="Masukkan nama...">
            </div>
            <div class="mb-3">
                <label class="small mb-1">Email</label>
                <input type="email" id="reg-email" class="form-control" placeholder="email@gmail.com">
            </div>
            <div class="mb-4">
                <label class="small mb-1">Password</label>
                <input type="password" id="reg-pass" class="form-control" placeholder="Min. 6 karakter">
            </div>

            <button onclick="handleRegister()" id="btn-reg" class="btn btn-primary w-100">DAFTAR SEKARANG</button>
            
            <p class="text-center mt-4 small text-muted">
                Sudah punya akun? <a href="loginreseller.html" class="text-primary text-decoration-none fw-bold">Login di sini</a>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
            authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
            projectId: "asdarstoredigitalll-d89c4",
            storageBucket: "asdarstoredigitalll-d89c4.appspot.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        async function handleRegister() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            if(!name || !email || !pass) return Swal.fire('Error', 'Lengkapi semua kolom!', 'error');
            if(pass.length < 6) return Swal.fire('Error', 'Password minimal 6 karakter!', 'warning');

            const btn = document.getElementById('btn-reg');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memproses...';

            try {
                // 1. Create User di Auth
                const cred = await auth.createUserWithEmailAndPassword(email, pass);
                
                // 2. Simpan Data ke Firestore
                await db.collection('resellers').doc(cred.user.uid).set({
                    nama: name,
                    email: email,
                    saldo: 0,
                    role: 'reseller',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                Swal.fire({
                    icon: 'success',
                    title: 'Pendaftaran Berhasil!',
                    text: 'Selamat bergabung di Asdar Store',
                    confirmButtonText: 'Masuk ke Dashboard'
                }).then(() => { window.location.href = 'index.html'; });

            } catch (e) {
                Swal.fire('Gagal Daftar', e.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'DAFTAR SEKARANG';
            }
        }
    </script>
</body>
</html>
