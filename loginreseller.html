<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Daftar - Asdar Store</title>
    <meta name="theme-color" content="#0f172a">
    
    <!-- Libraries (Sama seperti file utama) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { --primary: #3b82f6; --dark: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --border: rgba(255,255,255,0.1); }
        body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        .btn-google {
            background: white;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-google:active { transform: scale(0.98); background: #f1f1f1; }

        .nav-pills .nav-link {
            color: #94a3b8;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
        }
        .nav-pills .nav-link.active {
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--primary);
            font-weight: bold;
        }
        
        /* Animasi Back Button */
        .btn-back { position: absolute; top: 20px; left: 20px; color: #94a3b8; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .btn-back:hover { color: white; transform: translateX(-3px); }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i></a>
        
        <div class="text-center mb-4 mt-3">
            <h4 class="fw-bold">Asdar<span class="text-primary">Store</span></h4>
            <p class="text-muted small">Masuk untuk akses fitur Reseller</p>
        </div>

        <!-- Toggle Login/Register -->
        <ul class="nav nav-pills nav-fill mb-4 p-1 bg-black bg-opacity-25 rounded-4">
            <li class="nav-item">
                <a class="nav-link active" id="tab-login" onclick="switchMode('login')">Masuk</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tab-register" onclick="switchMode('register')">Daftar</a>
            </li>
        </ul>

        <!-- Form -->
        <form id="auth-form" onsubmit="handleEmailAuth(event)">
            <!-- Nama (Hanya muncul saat Daftar) -->
            <div id="name-container" class="mb-3" style="display: none;">
                <label class="small text-muted mb-1 ms-1">Nama Lengkap</label>
                <input type="text" id="input-name" class="form-control" placeholder="Contoh: Asdar Gans">
            </div>

            <div class="mb-3">
                <label class="small text-muted mb-1 ms-1">Email</label>
                <input type="email" id="input-email" class="form-control" placeholder="email@contoh.com" required>
            </div>

            <div class="mb-4">
                <label class="small text-muted mb-1 ms-1">Password</label>
                <div class="position-relative">
                    <input type="password" id="input-password" class="form-control" placeholder="••••••••" required>
                    <i class="fas fa-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" style="cursor:pointer" onclick="togglePass()"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" id="btn-submit">
                MASUK SEKARANG
            </button>
        </form>

        <div class="text-center mb-3">
            <span class="small text-muted">atau masuk dengan</span>
        </div>

        <button onclick="handleGoogleAuth()" class="btn btn-google w-100">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google">
            Google
        </button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // --- 1. Konfigurasi Firebase (SAMA DENGAN FILE UTAMA) ---
        const firebaseConfig = {
            apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
            authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
            projectId: "asdarstoredigitalll-d89c4",
            storageBucket: "asdarstoredigitalll-d89c4.appspot.com"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isLoginMode = true;

        // --- 2. Logika Switch Mode (Login <-> Daftar) ---
        function switchMode(mode) {
            isLoginMode = (mode === 'login');
            
            // UI Update
            document.getElementById('tab-login').classList.toggle('active', isLoginMode);
            document.getElementById('tab-register').classList.toggle('active', !isLoginMode);
            
            // Tampilkan/Sembunyikan input Nama
            const nameContainer = document.getElementById('name-container');
            const submitBtn = document.getElementById('btn-submit');
            const nameInput = document.getElementById('input-name');

            if(isLoginMode) {
                nameContainer.style.display = 'none';
                submitBtn.innerText = 'MASUK SEKARANG';
                nameInput.removeAttribute('required');
            } else {
                nameContainer.style.display = 'block';
                submitBtn.innerText = 'DAFTAR AKUN';
                nameInput.setAttribute('required', 'true');
            }
        }

        // --- 3. Toggle Password Visibility ---
        function togglePass() {
            const input = document.getElementById('input-password');
            const icon = document.querySelector('.fa-eye');
            if(input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // --- 4. Handle Email Auth (Login & Register) ---
        async function handleEmailAuth(e) {
            e.preventDefault();
            const email = document.getElementById('input-email').value;
            const pass = document.getElementById('input-password').value;
            const name = document.getElementById('input-name').value;

            Swal.fire({title: 'Memproses...', didOpen: () => Swal.showLoading()});

            try {
                if(isLoginMode) {
                    // --- LOGIN ---
                    await auth.signInWithEmailAndPassword(email, pass);
                    Swal.fire('Berhasil', 'Selamat datang kembali!', 'success').then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    // --- DAFTAR ---
                    const userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                    const user = userCredential.user;
                    
                    // Simpan data awal ke Firestore
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: email,
                        displayName: name,
                        role: 'member', // Default role
                        saldo: 0,       // Default saldo
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    Swal.fire('Sukses', 'Akun berhasil dibuat!', 'success').then(() => {
                        window.location.href = 'index.html';
                    });
                }
            } catch (error) {
                let msg = error.message;
                if(error.code === 'auth/wrong-password') msg = "Password salah.";
                if(error.code === 'auth/user-not-found') msg = "Email tidak terdaftar.";
                if(error.code === 'auth/email-already-in-use') msg = "Email sudah digunakan.";
                Swal.fire('Gagal', msg, 'error');
            }
        }

        // --- 5. Handle Google Auth ---
        async function handleGoogleAuth() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                // Cek apakah user sudah ada di database
                const doc = await db.collection('users').doc(user.uid).get();
                
                if (!doc.exists) {
                    // Jika belum ada (User Baru via Google), buat datanya
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName,
                        role: 'member',
                        saldo: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                Swal.fire('Berhasil', `Halo, ${user.displayName}!`, 'success').then(() => {
                    window.location.href = 'index.html';
                });

            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            }
        }

        // Cek jika user sudah login, langsung lempar ke index
        auth.onAuthStateChanged(user => {
            if(user) {
                // Opsional: Redirect otomatis jika membuka halaman ini tapi sudah login
                // window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
