<body data-theme="dark">
    <div class="container">
        <header>
            <h1 class="mb-3">Admin Dashboard</h1>
            <button id="logout-btn" class="btn btn-danger logout-btn">Logout</button>
            <ul class="nav nav-tabs" id="myTab" role="tablist">
                <!-- PERUBAHAN 1: Menambahkan Tab Konfirmasi Deposit -->
                <li class="nav-item" role="presentation"><button class="nav-link" id="deposits-tab" data-bs-toggle="tab" data-bs-target="#deposits" type="button" role="tab">Konfirmasi Deposit <span id="deposit-count" class="badge bg-danger ms-1" style="display: none;"></span></button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button" role="tab">Pesanan</button></li>

                <li class="nav-item" role="presentation"><button class="nav-link" id="active-resellers-tab" data-bs-toggle="tab" data-bs-target="#active-resellers" type="button" role="tab">Reseller Aktif</button></li>
                <!-- ... (Sisa tab Anda yang lain) ... -->
            </ul>
        </header>

        <div class="tab-content" id="myTabContent">
            <!-- PERUBAHAN 2: Menambahkan Konten untuk Tab Deposit -->
            <div class="tab-pane fade" id="deposits" role="tabpanel">
                <div class="section">
                    <h2>Konfirmasi Deposit Manual</h2>
                    <p>Setujui permintaan deposit setelah Anda memverifikasi pembayaran di mutasi rekening Anda.</p>
                    <div class="table-responsive-container">
                        <table id="deposits-table" class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID Deposit</th>
                                    <th>Email Pengguna</th>
                                    <th>Jumlah</th>
                                    <th>Waktu</th>
                                    <th>Bukti</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="deposits-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade show active" id="products" role="tabpanel">
                <div class="section">
                    <h2>Daftar Produk</h2>
                    <div class="table-responsive-container"><table id="products-table" class="table table-striped"><thead><tr><th>Nama</th><th>Kategori</th><th>Jenis</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
                    <hr>
                    <h2>Tambah/Edit Produk</h2>
                    <form id="product-form">
                        <input type="hidden" id="productId" />
                        <!-- ... (Input form produk Anda yang lain) ... -->
                        
                        <!-- PERUBAHAN 3: Menambahkan Pilihan Jenis Produk -->
                        <div class="mb-3">
                            <label for="jenis_produk">Jenis Produk</label>
                            <select id="jenis_produk" class="form-select">
                                <option value="manual">Manual (Diproses Admin)</option>
                                <option value="otomatis">Otomatis (Via API)</option>
                            </select>
                        </div>

                        <!-- ... (Sisa form produk Anda) ... -->
                        <button type="submit" class="btn btn-primary w-100">Simpan Produk</button>
                    </form>
                </div>
            </div>
            <!-- ... (Sisa konten tab Anda yang lain) ... -->
        </div>
    </div>

    <!-- ... (Toast container Anda) ... -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script> <!-- Tambahkan ini -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script>
        // ... (Konfigurasi Firebase dan fungsi umum Anda) ...
        const functions = firebase.functions(); // Inisialisasi functions

        // PERUBAHAN 4: Menambahkan listener untuk tab deposit
        function setupTabListeners() {
            document.getElementById('deposits-tab').addEventListener('click', loadPendingDeposits);
            // ... (Listener tab Anda yang lain) ...
        }

        // PERUBAHAN 5: Menambahkan logika untuk form produk
        productForm.addEventListener('submit', async (e) => {
            // ...
            const productData = {
                // ... (data produk Anda yang lain) ...
                jenis_produk: document.getElementById('jenis_produk').value,
                // ...
            };
            // ...
        });

        async function editProduct(id) {
            // ...
            document.getElementById('jenis_produk').value = product.jenis_produk || 'manual';
            // ...
        }

        // PERUBAHAN 6: Fungsi baru untuk memuat dan menyetujui deposit
        const depositsTableBody = document.getElementById('deposits-table-body');
        const depositCountBadge = document.getElementById('deposit-count');

        function loadPendingDeposits() {
            // Ambil deposit yang sudah diupload bukti oleh pengguna
            dbFS.collection('deposits').where('status', '==', 'Menunggu Konfirmasi').orderBy('createdAt', 'desc')
                .onSnapshot(snapshot => {
                    depositsTableBody.innerHTML = '';
                    if (snapshot.empty) {
                        depositsTableBody.innerHTML = `<tr><td colspan="6" class="text-center">Tidak ada deposit yang menunggu konfirmasi.</td></tr>`;
                        depositCountBadge.style.display = 'none';
                        return;
                    }
                    
                    depositCountBadge.textContent = snapshot.size;
                    depositCountBadge.style.display = 'inline';

                    snapshot.forEach(doc => {
                        const deposit = { id: doc.id, ...doc.data() };
                        const createdAt = deposit.createdAt ? deposit.createdAt.toDate().toLocaleString('id-ID') : 'N/A';
                        const row = depositsTableBody.insertRow();
                        row.innerHTML = `
                            <td><code>${deposit.id}</code></td>
                            <td>${deposit.userEmail}</td>
                            <td>${formatRupiah(deposit.amount)}</td>
                            <td>${createdAt}</td>
                            <td><a href="${deposit.bukti_pembayaran}" target="_blank" class="btn btn-sm btn-info">Lihat Bukti</a></td>
                            <td><button class="btn btn-success btn-sm" onclick="approveDeposit('${deposit.id}', this)">Setujui</button></td>
                        `;
                    });
                }, error => {
                    console.error("Gagal memuat deposit:", error);
                    depositsTableBody.innerHTML = `<tr><td colspan="6" class="text-danger">Gagal memuat data.</td></tr>`;
                });
        }

        async function approveDeposit(depositId, btn) {
            if (!confirm(`Anda yakin ingin menyetujui deposit ${depositId} dan menambahkan saldo ke pengguna? Pastikan Anda sudah cek mutasi.`)) return;

            setButtonLoading(btn, true, "Menyetujui...");
            try {
                const confirmDepositFunction = functions.httpsCallable('confirmManualDeposit');
                const result = await confirmDepositFunction({ depositId: depositId });
                showToast(result.data.message, 'success');
            } catch (error) {
                console.error("Gagal menyetujui deposit:", error);
                showToast(`Error: ${error.message}`, 'danger');
            } finally {
                // Tombol akan hilang otomatis saat data di-refresh oleh listener onSnapshot
            }
        }

        // ... (Sisa kode JavaScript admin Anda yang sudah ada) ...
    </script>
</body>
</html>
