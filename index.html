<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Asdar Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1abc9c; /* Teal */
            --secondary: #1a1a2e; /* Dark Blue */
            --card: #2c2c40; /* Lighter Blue/Grey */
            --text: #e0e0e0;
            --muted-text: #8a93a2;
            --border: #444;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--secondary);
            color: var(--text);
        }
        .icon-bg {
            background-color: rgba(26, 188, 156, 0.1); /* Light teal background for icons */
        }
        .bottom-nav-item.active i,
        .bottom-nav-item.active span {
            color: var(--primary);
        }
    </style>
</head>
<body class="antialiased">

    <div class="container mx-auto max-w-lg min-h-screen flex flex-col">

        <!-- Header -->
        <header class="p-4 flex justify-between items-center">
            <div>
                <p class="text-sm text-[var(--muted-text)]">Selamat Datang,</p>
                <h1 class="text-xl font-bold">Budi Santoso</h1>
            </div>
            <div class="w-12 h-12 bg-[var(--card)] rounded-full flex items-center justify-center border-2 border-[var(--primary)]">
                <i class="fas fa-user text-xl text-[var(--primary)]"></i>
            </div>
        </header>

        <!-- Balance Card -->
        <section class="p-4">
            <div class="bg-[var(--card)] rounded-xl p-5 shadow-lg">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-sm text-[var(--muted-text)]">Saldo Anda</p>
                        <p class="text-3xl font-bold">Rp120.500</p>
                    </div>
                    <button class="bg-[var(--primary)] text-white font-semibold py-2 px-4 rounded-full text-sm inline-flex items-center gap-2 hover:bg-opacity-80 transition-colors">
                        <i class="fas fa-plus-circle"></i>
                        <span>Isi Saldo</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Grid Menu -->
        <section class="p-4 mt-2">
            <div class="grid grid-cols-4 gap-4 text-center">
                
                <!-- Menu Item: Pulsa -->
                <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-mobile-alt text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Pulsa</span>
                </a>

                <!-- Menu Item: Paket Data -->
                <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-wifi text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Paket Data</span>
                </a>

                <!-- Menu Item: Game -->
                <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-gamepad text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Voucher Game</span>
                </a>

                <!-- Menu Item: Token Listrik -->
                <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-bolt text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Token Listrik</span>
                </a>

                <!-- Menu Item: E-Wallet -->
                 <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-wallet text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">E-Wallet</span>
                </a>

                <!-- Menu Item: BPJS -->
                <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-heartbeat text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">BPJS</span>
                </a>

                <!-- Menu Item: PDAM -->
                <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-tint text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">PDAM</span>
                </a>

                <!-- Menu Item: Lainnya -->
                <a href="#" class="menu-item flex flex-col items-center p-2 rounded-lg hover:bg-[var(--card)] transition-colors">
                    <div class="w-14 h-14 icon-bg rounded-full flex items-center justify-center">
                        <i class="fas fa-th-large text-2xl text-[var(--primary)]"></i>
                    </div>
                    <span class="text-xs mt-2 font-medium">Lainnya</span>
                </a>

            </div>
        </section>

        <!-- Promo Banner -->
        <section class="p-4 mt-2">
            <div class="promo-banner rounded-xl overflow-hidden shadow-lg">
                <img src="https://placehold.co/600x250/1ABC9C/FFFFFF?text=Promo+Spesial!" alt="Promo Banner" class="w-full h-auto">
            </div>
        </section>

        <!-- Spacer to push nav to bottom -->
        <div class="flex-grow"></div>

        <!-- Bottom Navigation -->
        <footer class="bg-[var(--card)] sticky bottom-0 w-full max-w-lg mx-auto rounded-t-2xl shadow-t-lg border-t border-[var(--border)]">
            <nav class="flex justify-around p-3">
                <a href="#" class="bottom-nav-item flex flex-col items-center text-[var(--muted-text)] active">
                    <i class="fas fa-home text-xl"></i>
                    <span class="text-xs mt-1">Home</span>
                </a>
                <a href="#" class="bottom-nav-item flex flex-col items-center text-[var(--muted-text)]">
                    <i class="fas fa-history text-xl"></i>
                    <span class="text-xs mt-1">Riwayat</span>
                </a>
                <a href="#" class="bottom-nav-item flex flex-col items-center text-[var(--muted-text)]">
                    <i class="fas fa-comment-dots text-xl"></i>
                    <span class="text-xs mt-1">Bantuan</span>
                </a>
                <a href="#" class="bottom-nav-item flex flex-col items-center text-[var(--muted-text)]">
                    <i class="fas fa-user-circle text-xl"></i>
                    <span class="text-xs mt-1">Akun</span>
                </a>
            </nav>
        </footer>

    </div>

</body>
</html>
