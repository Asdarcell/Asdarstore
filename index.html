<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asdar Store - Reseller Digital</title>
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --card: #1e293b;
            --glass: rgba(30, 41, 59, 0.65);
            --text: #f8fafc;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: linear-gradient(to bottom, #0f172a, #020617);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 90px;
        }

        /* Header & Saldo Card */
        .app-header {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .card-saldo {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(59,130,246,0.35);
            position: relative;
            overflow: hidden;
        }

        .card-saldo::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, transparent 60%);
            animation: shine 7s infinite linear;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(0deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(360deg); }
        }

        .saldo-amount { font-size: 2.3rem; font-weight: 800; letter-spacing: -1px; }
        .eye-icon { cursor: pointer; transition: all 0.3s; }
        .eye-icon:hover { opacity: 0.8; transform: scale(1.15); }

        /* Quick Menu */
        .quick-menu .col-3 {
            text-align: center;
        }
        .quick-icon {
            width: 64px; height: 64px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 8px;
            font-size: 1.5rem;
            transition: all 0.25s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        .quick-icon:active { transform: scale(0.88); }

        /* Product Section */
        .product-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .product-card:active {
            transform: translateY(-4px) scale(0.98);
            box-shadow: 0 12px 30px rgba(59,130,246,0.28);
            border-color: var(--primary);
        }

        /* Category Tabs */
        #category-tabs {
            gap: 10px;
            padding-bottom: 8px;
        }
        #category-tabs button {
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.3s;
        }
        #category-tabs button.btn-light {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(59,130,246,0.35);
        }

        /* Bottom Navigation */
        .nav-bottom {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 10px 0;
            z-index: 1050;
        }
        .nav-link {
            color: #94a3b8;
            font-size: 0.78rem;
            transition: all 0.3s;
        }
        .nav-link.active {
            color: var(--primary);
            font-weight: 700;
        }
        .nav-link i { font-size: 1.4rem; margin-bottom: 4px; }

        /* Modal & Offcanvas */
        .modal-content, .offcanvas {
            background: var(--card);
            color: var(--text);
            border: none;
            border-radius: 24px;
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(59,130,246,0.25);
        }

        .target-box {
            background: rgba(255,255,255,0.07);
            padding: 8px 12px;
            border-radius: 10px;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        .target-box:active {
            background: rgba(59,130,246,0.25);
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header p-3 pb-2">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold m-0">Asdar<span class="text-primary">Store</span></h4>
                <span id="badge-status" style="display:none;" class="badge bg-warning text-dark mt-1 px-3 py-1">
                    <i class="fas fa-crown me-1"></i>MITRA PREMIUM
                </span>
            </div>
            <div id="auth-btn">
                <button onclick="location.href='loginreseller.html'" class="btn btn-sm btn-outline-light rounded-pill px-3">
                    Login
                </button>
            </div>
        </div>

        <div class="card-saldo text-white">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <small class="opacity-75 d-block mb-1">Saldo Mitra</small>
                    <h2 class="fw-bold saldo-amount mb-0" id="user-balance">Rp 0</h2>
                </div>
                <i class="fas fa-eye eye-icon fs-3" id="toggle-saldo" onclick="toggleSaldo()"></i>
            </div>
            <button onclick="openTopup()" class="btn btn-light text-primary fw-bold rounded-pill px-4 mt-3 shadow w-100">
                <i class="fas fa-plus me-2"></i> Isi Saldo
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mt-4 px-3">
        <!-- Quick Menu -->
        <div class="row g-3 mb-4 quick-menu text-center">
            <div class="col-3" onclick="openTopup()">
                <div class="quick-icon bg-primary bg-opacity-10 text-primary"><i class="fas fa-wallet"></i></div>
                <small>Deposit</small>
            </div>
            <div class="col-3" onclick="openHistory()">
                <div class="quick-icon bg-warning bg-opacity-10 text-warning"><i class="fas fa-receipt"></i></div>
                <small>Riwayat</small>
            </div>
            <div class="col-3" onclick="openCS()">
                <div class="quick-icon bg-success bg-opacity-10 text-success"><i class="fas fa-headset"></i></div>
                <small>Bantuan</small>
            </div>
            <div class="col-3" onclick="location.reload()">
                <div class="quick-icon bg-danger bg-opacity-10 text-danger"><i class="fas fa-sync"></i></div>
                <small>Refresh</small>
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">Produk Populer</h5>
                <small class="text-muted">🟢 Ready • 🔴 Gangguan</small>
            </div>
            <div id="category-tabs" class="d-flex gap-2 overflow-auto no-scrollbar pb-2"></div>
        </div>

        <div id="product-list" class="row g-3">
            <div class="col-12 text-center py-5 text-muted">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="mt-3">Memuat produk...</div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="nav-bottom d-flex justify-content-around">
        <a href="#" class="nav-link active"><i class="fas fa-home"></i><div>Home</div></a>
        <a href="javascript:void(0)" onclick="openHistory()" class="nav-link"><i class="fas fa-receipt"></i><div>Riwayat</div></a>
        <div class="dropdown">
            <a href="#" class="nav-link dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown">
                <i class="fas fa-user-circle"></i><div>Akun</div>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg">
                <li><a class="dropdown-item" href="javascript:void(0)" onclick="openProfileDetail()"><i class="fas fa-id-card me-2"></i>Profil</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="javascript:void(0)" onclick="auth.signOut()"><i class="fas fa-sign-out-alt me-2"></i>Keluar</a></li>
            </ul>
        </div>
    </nav>

    <!-- [Modal & Offcanvas sections sama seperti kode sebelumnya, saya tidak copy ulang supaya tidak terlalu panjang. Gunakan dari kode lama Anda] -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // Firebase config dan logic lainnya tetap sama seperti kode Anda sebelumnya
        // ... (paste semua script Firebase, auth, loadProducts, dll dari kode lama Anda)

        // Tambahan: Fungsi hide/show saldo
        let saldoVisible = true;
        function toggleSaldo() {
            const el = document.getElementById('user-balance');
            const icon = document.getElementById('toggle-saldo');
            if (saldoVisible) {
                el.innerText = 'Rp ****.***';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                const saldo = userData?.saldo || 0;
                el.innerText = `Rp ${saldo.toLocaleString('id-ID')}`;
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
            saldoVisible = !saldoVisible;
        }

        // Inisialisasi saldo visible saat load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('toggle-saldo').classList.add('fa-eye');
        });
    </script>
</body>
</html>
