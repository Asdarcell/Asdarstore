<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asdar Store Digital</title>
  <link rel="icon" href="favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f9; --text: #2c3e50; --primary: #3498db;
      --card: #ffffff; --border: #e0e0e0; --shadow: rgba(0, 0, 0, 0.05);
      --success: #28a745; --danger: #e74c3c; --muted-text: #6c757d;
    }
    [data-theme="dark"] {
      --bg: #1a1a2e; --text: #e0e0e0; --primary: #1abc9c;
      --card: #2c2c40; --border: #444; --shadow: rgba(0, 0, 0, 0.15);
      --muted-text: #8a93a2;
    }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6; }
    header {
      position: sticky; top: 0; background: var(--card); padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); z-index: 1000;
    }
    main { max-width: 700px; margin: 20px auto; padding: 0 15px; }
    .section-container { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 12px var(--shadow); margin-top: 20px; }
    h2 { color: var(--primary); margin-bottom: 20px; text-align: center; }
    
    /* Header Baru dengan Saldo */
    .header-wallet { display: flex; align-items: center; gap: 15px; }
    .wallet-balance { background: var(--bg); padding: 5px 15px; border-radius: 50px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .wallet-balance .fa-wallet { color: var(--primary); }
    .deposit-btn { background: var(--success); color: white; padding: 5px 12px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
    
    /* Grid Kategori */
    #category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .category-item { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card); padding: 15px 5px; border-radius: 12px; text-align: center; cursor: pointer; transition: transform 0.2s ease; border: 1px solid var(--border); }
    .category-item.active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); }
    .category-item.active .category-icon, .category-item.active .category-name { color: white; }
    .category-icon { font-size: 24px; color: var(--primary); margin-bottom: 8px; }
    .category-name { font-size: 12px; font-weight: 600; }

    /* Modal Deposit */
    #deposit-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1001; }
    #deposit-modal-content { background: var(--card); padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; max-height: 90vh; overflow-y: auto;}
    
    /* Style untuk fitur lama */
    .info { background: var(--card); padding: 15px; margin-top: 1rem; border-left: 5px solid var(--primary); border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); }
    hr { margin: 40px 0; border: 0; border-top: 1px solid var(--border); }
    #testimoniContainer { background: var(--bg); border-radius: 12px; padding: 15px; height: 350px; overflow-y: auto; position: relative; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 1rem; }
    .faq-item { border-bottom: 1px solid var(--border); padding: 15px 0; }
    .faq-question { cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .faq-item.active .faq-answer { max-height: 999px; }

    /* Style untuk form deposit baru */
    .topup-btn-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .topup-btn { background-color: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; }
    .topup-btn.selected { background-color: var(--primary); color: white; border-color: var(--primary); }
    .notification { padding: 10px; margin-bottom: 15px; border-radius: 8px; font-weight: 600; display: none; }
    .notification.success { background-color: #d4edda; color: #155724; }
    .notification.error { background-color: #f8d7da; color: #721c24; }
    .notification.info { background-color: #d1ecf1; color: #0c5460; }
    .payment-method-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); }
    .payment-method-item:last-child { border-bottom: none; }
    .payment-method-name { font-weight: bold; }
    .payment-method-an, .payment-method-number { font-size: 0.9em; color: var(--muted-text); }
    .copy-btn { background: var(--primary); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
  </style>
</head>

<body>
<header id="header">
    <div id="user-panel-left">
        <a href="login.html" class="btn btn-primary btn-sm">Login/Daftar</a>
    </div>
    <div id="user-panel-right" class="header-wallet" style="display: none;">
        <div class="wallet-balance">
            <i class="fas fa-wallet"></i>
            <span id="balance-amount">Rp 0</span>
        </div>
        <a href="#" id="btn-show-deposit" class="deposit-btn"><i class="fas fa-plus"></i> Deposit</a>
    </div>
</header>
  
<main id="main-content">
    <div class="section-container" data-aos="fade-up">
        <h2>Kategori Produk</h2>
        <div id="category-grid"></div>
    </div>
    
    <div data-aos="fade-up" class="section-container" id="order-form-container" style="display: none;">
      <h2 id="form-title">Pilih Produk</h2>
      <div id="product-selection-area"></div>
      <div id="customer-data-area" style="display:none;">
            <label for="nomor">Nomor HP / ID Game</label>
            <input type="text" id="nomor" class="form-control" placeholder="Cth: 081234567890" required />
      </div>
      <button type="button" id="purchaseBtn" class="btn btn-primary w-100 mt-3" disabled>Bayar dengan Saldo</button>
    </div>

    <hr>
    <div data-aos="fade-up"><h2>Testimoni Pelanggan</h2><div id="testimoniContainer"></div></div>
    <div data-aos="fade-up" class="section-container"><h2>Beri Testimoni</h2><form id="formTestimoni"><label for="testiNama">Nama Anda</label><input type="text" id="testiNama" class="form-control" required><label for="testiPesan">Pesan Anda</label><textarea id="testiPesan" class="form-control" rows="4" required></textarea><button type="submit" class="btn btn-info w-100">Kirim</button></form></div>
    <hr>
    <div data-aos="fade-up"><h2>Tanya Jawab</h2><div class="section-container" id="faq-container"></div></div>
    <hr>
    <div data-aos="fade-up" class="section-container"><h2>Cek Status Pesanan</h2><form onsubmit="event.preventDefault(); cekStatus();"><label for="idCek">Masukkan ID Pesanan/Deposit</label><input type="text" id="idCek" class="form-control" required /><button type="submit" class="btn btn-secondary w-100">Cek</button></form></div>
</main>

<div id="deposit-modal">
    <div id="deposit-modal-content">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h3 class="mb-0">Isi Saldo Deposit</h3>
            <button id="btn-close-deposit" style="background:none; border:none; font-size: 1.5rem; color: var(--text);">&times;</button>
        </div>
        
        <div class="info mt-3">
            <p>Silakan transfer ke salah satu rekening di bawah ini dan konfirmasi pembayaran Anda melalui form di bawah.</p>
            <div id="payment-methods-topup"><p>Memuat info pembayaran...</p></div>
        </div>

        <hr style="margin: 20px 0;">
        <form id="confirmation-form" onsubmit="return false;">
            <div id="form-status" class="notification"></div>
            
            <label>Pilih Nominal</label>
            <div class="topup-btn-group">
                <button type="button" class="topup-btn" data-nominal="20000">Rp 20.000</button>
                <button type="button" class="topup-btn" data-nominal="50000">Rp 50.000</button>
                <button type="button" class="topup-btn" data-nominal="100000">Rp 100.000</button>
                <button type="button" class="topup-btn" data-nominal="250000">Rp 250.000</button>
            </div>

            <label for="nominalInput" class="mt-3">Nominal Lain (Min. Rp 10.000)</label>
            <input type="number" id="nominalInput" class="form-control" placeholder="Masukkan Nominal" min="10000">

            <label for="senderName">Nama Pengirim (sesuai rekening)</label>
            <input type="text" id="senderName" class="form-control" placeholder="Nama Anda" required>
            
            <label for="paymentMethodSelect">Metode Pembayaran Transfer</label>
            <select id="paymentMethodSelect" class="form-select" required>
                <option value="">Pilih Metode</option>
            </select>
            
            <label for="uploadProof">Upload Bukti Transfer</label>
            <input type="file" id="uploadProof" class="form-control" accept="image/*" required>
            
            <button type="submit" id="submit-btn-topup" class="btn btn-success w-100 mt-3" disabled>Pilih Nominal Dahulu</button>
        </form>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 800, once: true, offset: 50 });

    const firebaseConfig = {
      apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
      authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
      databaseURL: "https://asdarstoredigitalll-d89c4-default-rtdb.firebaseio.com",
      projectId: "asdarstoredigitalll-d89c4",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const functions = firebase.functions();
    const dbRT = firebase.database();

    // === ELEMEN DOM ===
    const userPanelLeft = document.getElementById('user-panel-left');
    const userPanelRight = document.getElementById('user-panel-right');
    const balanceAmountEl = document.getElementById('balance-amount');
    const depositModal = document.getElementById('deposit-modal');
    const orderFormContainer = document.getElementById('order-form-container');
    const productSelectionArea = document.getElementById('product-selection-area');
    const customerDataArea = document.getElementById('customer-data-area');
    const purchaseBtn = document.getElementById('purchaseBtn');
    const formTitle = document.getElementById('form-title');
    
    // === VARIABEL GLOBAL ===
    let currentUser = null;
    let produkTerpilihData = null;
    let unsubscribeWallet = null;

    const categoryIcons = {
        'PULSA': 'fas fa-mobile-alt', 'TOKEN LISTRIK': 'fas fa-bolt',
        'GAMES': 'fas fa-gamepad', 'E-MONEY': 'fas fa-wallet',
        'VOUCHER DATA': 'fas fa-wifi', 'DEFAULT': 'fas fa-box'
    };

    // === FUNGSI UTAMA & EVENT LISTENERS ===
    document.addEventListener('DOMContentLoaded', () => {
      loadAndDisplayCategories();
      loadApprovedTestimonials();
      loadAndRenderFaq();
      loadPaymentMethods(); // Memuat metode pembayaran saat halaman siap
      
      document.getElementById('formTestimoni').addEventListener('submit', handleTestimoniSubmit);
      document.getElementById('btn-show-deposit').addEventListener('click', () => depositModal.style.display = 'flex');
      document.getElementById('btn-close-deposit').addEventListener('click', () => depositModal.style.display = 'none');
      purchaseBtn.addEventListener('click', handlePurchase);
    });

    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
            userPanelLeft.style.display = 'none';
            userPanelRight.style.display = 'flex';
            if (unsubscribeWallet) unsubscribeWallet();
            unsubscribeWallet = db.collection('wallets').doc(user.uid).onSnapshot(doc => {
                const balance = doc.exists ? (doc.data().balance || 0) : 0;
                balanceAmountEl.innerText = `Rp ${balance.toLocaleString('id-ID')}`;
            }, console.error);
        } else {
            userPanelLeft.style.display = 'block';
            userPanelRight.style.display = 'none';
            balanceAmountEl.innerText = 'Rp 0';
            if (unsubscribeWallet) unsubscribeWallet();
        }
    });

    // === LOGIKA TAMPILAN KATEGORI & PRODUK ===
    async function loadAndDisplayCategories() {
        const categoryGrid = document.getElementById('category-grid');
        try {
            const snapshot = await db.collection('produk').get();
            const categories = [...new Set(snapshot.docs.map(doc => doc.data().kategori))];
            
            categoryGrid.innerHTML = '';
            categories.forEach(kategori => {
                if (!kategori) return;
                const item = document.createElement('div');
                item.className = 'category-item';
                item.dataset.kategori = kategori;
                const iconClass = categoryIcons[kategori.toUpperCase()] || categoryIcons['DEFAULT'];
                item.innerHTML = `<i class="category-icon ${iconClass}"></i><span class="category-name">${kategori}</span>`;
                item.addEventListener('click', () => handleCategoryClick(kategori, item));
                categoryGrid.appendChild(item);
            });
        } catch (error) {
            console.error("Gagal memuat kategori:", error);
        }
    }
    
    async function handleCategoryClick(kategori, element) {
        document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        
        orderFormContainer.style.display = 'block';
        formTitle.innerText = `Kategori: ${kategori}`;
        productSelectionArea.innerHTML = '<p class="text-center">Memuat produk...</p>';
        customerDataArea.style.display = 'none';
        purchaseBtn.disabled = true;

        try {
            const snapshot = await db.collection('produk').where('kategori', '==', kategori).get();
            let productsHTML = `<label for="produk">Produk</label><select id="produk" class="form-select" required><option value="">Pilih Produk</option>`;
            const products = [];
            snapshot.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
            products.sort((a, b) => (a.urutan || 0) - (b.urutan || 0));
            
            products.forEach(prod => { productsHTML += `<option value="${prod.id}">${prod.nama_produk}</option>`; });
            productsHTML += `</select><div class="info mt-2" id="infoProduk">Pilih produk untuk melihat detail.</div>`;
            
            productSelectionArea.innerHTML = productsHTML;
            document.getElementById('produk').addEventListener('change', handleProductSelection);
            window.scrollTo({ top: orderFormContainer.offsetTop - 80, behavior: 'smooth' });
        } catch (error) {
            console.error("Error saat memuat produk:", error);
            productSelectionArea.innerHTML = '<p class="text-danger">Gagal memuat produk. Silakan coba lagi.</p>';
        }
    }

    async function handleProductSelection() {
        const produkId = document.getElementById('produk').value;
        const infoProduk = document.getElementById('infoProduk');
        
        if (!produkId) {
            infoProduk.innerHTML = 'Pilih produk untuk melihat detail.';
            customerDataArea.style.display = 'none';
            purchaseBtn.disabled = true;
            return;
        }
        
        infoProduk.innerHTML = 'Memuat detail...';
        try {
            const doc = await db.collection('produk').doc(produkId).get();
            if (!doc.exists) { infoProduk.innerHTML = 'Produk tidak ditemukan.'; return; }
            
            produkTerpilihData = { id: doc.id, ...doc.data() };
            const harga = produkTerpilihData.harga_reseller || produkTerpilihData.harga_umum || 0;
            const stok = produkTerpilihData.stok || 0;
            
            let jenisProdukLabel = produkTerpilihData.jenis_produk === 'otomatis' ? `<span class="badge bg-success">⚡ Otomatis</span><br><br>` : '';

            infoProduk.innerHTML = `${jenisProdukLabel}<b style="font-size: 1.2em;">Harga: Rp${harga.toLocaleString('id-ID')}</b><hr class="my-2"><b>Deskripsi:</b> ${produkTerpilihData.deskripsi || '-'}`;

            if (stok > 0) {
                customerDataArea.style.display = 'block';
                purchaseBtn.disabled = false;
            } else {
                infoProduk.innerHTML += `<br><b class="text-danger">Stok saat ini habis.</b>`;
                customerDataArea.style.display = 'none';
                purchaseBtn.disabled = true;
            }
        } catch (error) {
            infoProduk.innerHTML = 'Gagal memuat detail produk.';
        }
    }

    // === LOGIKA DEPOSIT BARU & PEMBELIAN ===

    // PERINGATAN KEAMANAN: Kunci API ini bisa dilihat oleh pengunjung website.
    // Sebaiknya, pindahkan proses upload ke backend (Cloud Function) untuk keamanan.
    const ImgBB_API_KEY = "4bb65566f2b6bad0aef16ac5ae6b2fbc";

    const confirmationForm = document.getElementById('confirmation-form');
    const nominalButtons = document.querySelectorAll('.topup-btn');
    const nominalInput = document.getElementById('nominalInput');
    const submitBtnTopup = document.getElementById('submit-btn-topup');
    const paymentMethodSelect = document.getElementById('paymentMethodSelect');
    const paymentMethodsTopup = document.getElementById('payment-methods-topup');
    const formStatus = document.getElementById('form-status');
    let selectedNominal = null;

    function showStatusTopup(message, type) {
        formStatus.textContent = message;
        formStatus.className = `notification ${type}`;
        formStatus.style.display = 'block';
    }

    nominalButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            nominalButtons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedNominal = parseInt(btn.dataset.nominal, 10);
            nominalInput.value = selectedNominal;
            submitBtnTopup.disabled = false;
            submitBtnTopup.textContent = 'Kirim Bukti Konfirmasi';
        });
    });

    nominalInput.addEventListener('input', () => {
        nominalButtons.forEach(b => b.classList.remove('selected'));
        selectedNominal = parseInt(nominalInput.value, 10);
        if (selectedNominal && selectedNominal >= 10000) {
            submitBtnTopup.disabled = false;
            submitBtnTopup.textContent = 'Kirim Bukti Konfirmasi';
        } else {
            submitBtnTopup.disabled = true;
            submitBtnTopup.textContent = 'Minimal Deposit Rp 10.000';
        }
    });
    
    window.copyToClipboard = (text, element) => {
        navigator.clipboard.writeText(text).then(() => {
            const originalHtml = element.innerHTML;
            element.innerHTML = `Disalin!`;
            element.disabled = true;
            setTimeout(() => {
                element.innerHTML = originalHtml;
                element.disabled = false;
            }, 2000);
        }).catch(err => {
            alert('Gagal menyalin. Mohon salin secara manual.');
        });
    };
    
    async function loadPaymentMethods() {
        try {
            const snapshot = await db.collection('infoPembayaran').get();
            paymentMethodSelect.innerHTML = '<option value="">Pilih Metode</option>';
            paymentMethodsTopup.innerHTML = '';

            snapshot.forEach(doc => {
                const data = doc.data();
                paymentMethodSelect.innerHTML += `<option value="${data.metode}">${data.metode}</option>`;
                paymentMethodsTopup.innerHTML += `
                    <div class="payment-method-item">
                        <div>
                            <div class="payment-method-name">${data.metode}</div>
                            <div class="payment-method-number">${data.nomor}</div>
                            <div class="payment-method-an">a.n ${data.atas_nama}</div>
                        </div>
                        <button class="copy-btn" onclick="copyToClipboard('${data.nomor}', this)">Salin</button>
                    </div>`;
            });
        } catch (error) {
            console.error("Gagal memuat metode pembayaran:", error);
            paymentMethodsTopup.innerHTML = `<p class="text-danger">Gagal memuat info pembayaran.</p>`;
        }
    }
    
    async function uploadImageToImgBB(file) {
        const formData = new FormData();
        formData.append("key", ImgBB_API_KEY);
        formData.append("image", file);

        const response = await fetch("https://api.imgbb.com/1/upload", {
            method: "POST",
            body: formData,
        });
        const data = await response.json();
        if (data.success) {
            return data.data.url;
        } else {
            throw new Error(data.error.message);
        }
    }
    
    confirmationForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) {
            showStatusTopup('Anda harus login untuk melakukan deposit!', 'error');
            return;
        }
        if (!selectedNominal || selectedNominal < 10000) {
            showStatusTopup('Pilih atau masukkan nominal yang valid (min. Rp 10.000)!', 'error');
            return;
        }

        const senderName = document.getElementById('senderName').value;
        const paymentMethod = paymentMethodSelect.value;
        const proofFile = document.getElementById('uploadProof').files[0];
        if (!senderName || !paymentMethod || !proofFile) {
            showStatusTopup('Harap lengkapi semua field dan unggah bukti transfer.', 'error');
            return;
        }

        submitBtnTopup.disabled = true;
        submitBtnTopup.innerHTML = "Memproses...";
        showStatusTopup('Mengunggah bukti dan mengirim konfirmasi...', 'info');

        try {
            const fileUrl = await uploadImageToImgBB(proofFile);
            const depositId = 'D' + Date.now();
            await db.collection('deposits').doc(depositId).set({
                id: depositId,
                userId: currentUser.uid,
                email: currentUser.email,
                nominal: selectedNominal,
                metode_pembayaran: paymentMethod,
                nama_pengirim: senderName,
                bukti_url: fileUrl,
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            showStatusTopup('Konfirmasi berhasil dikirim! Saldo akan bertambah setelah diverifikasi oleh admin.', 'success');
            confirmationForm.reset();
            nominalButtons.forEach(b => b.classList.remove('selected'));
            submitBtnTopup.disabled = true;
            submitBtnTopup.textContent = 'Pilih Nominal Dahulu';
            
            setTimeout(() => {
                depositModal.style.display = 'none';
            }, 3000);

        } catch (error) {
            console.error("Error saat mengirim konfirmasi:", error);
            showStatusTopup('Gagal mengirim konfirmasi. ' + error.message, 'error');
            submitBtnTopup.disabled = false;
            submitBtnTopup.textContent = 'Kirim Bukti Konfirmasi';
        }
    });

    async function handlePurchase() {
        if (!currentUser || !produkTerpilihData) return;
        const nomorTujuan = document.getElementById('nomor').value;
        if (!nomorTujuan) { alert("Masukkan nomor tujuan."); return; }
        
        const productPrice = produkTerpilihData.harga_reseller || produkTerpilihData.harga_umum;
        if (!confirm(`Bayar ${produkTerpilihData.nama_produk} seharga Rp ${productPrice.toLocaleString('id-ID')} dengan saldo?`)) return;

        purchaseBtn.disabled = true; purchaseBtn.innerText = "Memproses...";

        try {
            const purchaseFunction = functions.httpsCallable('purchaseWithBalance');
            const result = await purchaseFunction({ productId: produkTerpilihData.id, nomorTujuan });
            alert(result.data.message);
            orderFormContainer.style.display = 'none';
        } catch (error) {
            alert(`Error: ${error.message}`);
        } finally {
            purchaseBtn.disabled = false; purchaseBtn.innerText = "Bayar dengan Saldo";
        }
    }

    // === FITUR LAMA YANG DIKEMBALIKAN ===
    window.cekStatus = async () => {
        const idCek = document.getElementById('idCek').value.trim();
        if (!idCek) { alert("ID tidak boleh kosong."); return; }
        window.location.href = `status.html?id=${idCek}`;
    }

    async function handleTestimoniSubmit(e) {
        e.preventDefault();
        const nama = document.getElementById('testiNama').value;
        const pesan = document.getElementById('testiPesan').value;
        if (!nama || !pesan) { alert("Nama dan pesan wajib diisi."); return; }
        try {
            await dbRT.ref('testimonials').push({ nama, isi: pesan, status: 'pending', createdAt: new Date().toISOString() });
            alert("Terima kasih! Testimoni Anda akan kami review.");
            e.target.reset();
        } catch (error) {
            alert("Gagal mengirim testimoni.");
        }
    }

    function loadApprovedTestimonials() {
        const container = document.getElementById('testimoniContainer');
        dbRT.ref('testimonials').orderByChild('status').equalTo('disetujui').limitToLast(10).on('value', snap => {
            container.innerHTML = '';
            if (!snap.exists()) { container.innerHTML = `<p class="text-center text-muted">Belum ada testimoni.</p>`; return; }
            snap.forEach(childSnap => {
                const testi = childSnap.val();
                const bubble = document.createElement('div');
                bubble.className = 'alert alert-light';
                bubble.innerHTML = `<strong>${testi.nama}</strong>: ${testi.isi}`;
                container.prepend(bubble);
            });
        });
    }

    function loadAndRenderFaq() {
        const faqContainer = document.getElementById('faq-container');
        dbRT.ref('faq').once('value').then(snap => {
            faqContainer.innerHTML = '';
            if (!snap.exists()) { faqContainer.innerHTML = `<p class="text-center text-muted">FAQ tidak tersedia.</p>`; return; }
            snap.forEach(itemSnap => {
                const itemData = itemSnap.val();
                const item = document.createElement('div');
                item.className = 'faq-item';
                item.innerHTML = `<div class="faq-question">${itemData.q}</div><div class="faq-answer" style="padding: 0 15px;">${itemData.a}</div>`;
                faqContainer.appendChild(item);
            });
            document.querySelectorAll('.faq-question').forEach(item => {
                item.addEventListener('click', () => item.parentElement.classList.toggle('active'));
            });
        });
    }
</script>
</body>
