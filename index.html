<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asdar Store Digital</title>
    <link rel="icon" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1abc9c" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f7fa; --text: #2c3e50; --primary: #3498db;
            --card: #ffffff; --border: #e8eef3; --shadow: rgba(44, 62, 80, 0.08);
            --success: #28a745; --danger: #e74c3c; --warning: #f39c12;
            --muted-text: #7f8c8d;
        }
        [data-theme="dark"] {
            --bg: #161828; --text: #e0e0e0; --primary: #1abc9c;
            --card: #252840; --border: #363a55; --shadow: rgba(0, 0, 0, 0.15);
            --muted-text: #8a93a2;
        }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
            margin: 0; line-height: 1.6;
            padding-bottom: 80px;
        }
        #app-container { max-width: 700px; margin: 0 auto; padding: 20px; }

        /* Gaya Navigasi, Header, Kartu, Grid, Form, dll. */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 700px; margin: 0 auto; background: var(--card); display: flex; justify-content: space-around; box-shadow: 0 -5px 20px var(--shadow); border-top: 1px solid var(--border); z-index: 1001; }
        .bottom-nav-item { display: flex; flex-direction: column; align-items: center; padding: 10px 12px; text-decoration: none; color: var(--muted-text); gap: 4px; transition: color 0.2s ease; border: none; background: none; cursor: pointer; }
        .bottom-nav-item i { font-size: 20px; }
        .bottom-nav-item span { font-size: 12px; }
        .bottom-nav-item.active { color: var(--primary); font-weight: 600; }

        #header-dashboard, #header-pesanan { background-color: var(--primary); color: white; padding: 15px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; }
        #header-dashboard h1 { font-size: 20px; font-weight: 600; margin: 0; }
        #header-pesanan h1 { flex-grow: 1; text-align: center; font-size: 20px; margin: 0; }
        .back-btn { background: none; border: none; font-size: 22px; color: white; cursor: pointer; padding-right: 15px; }

        .info-card { background: var(--card); border-radius: 12px; padding: 15px; margin-top: 20px; box-shadow: 0 10px 25px var(--shadow); display: flex; justify-content: space-around; align-items: center; text-align: center; }
        .info-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .info-item a { text-decoration: none; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .info-value { font-size: 16px; font-weight: 600; }
        .kategori-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .kategori-item { display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: var(--text); }
        .kategori-icon { width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 8px; transition: transform 0.2s ease; background-color: var(--bg); }
        
        .section-container { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 12px var(--shadow); margin-top: 20px; }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        label { font-weight: 600; margin-top: 15px; display: block; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--card); color: var(--text); }
        button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; font-size: 16px; transition: all 0.2s ease; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .info { background: var(--card); padding: 15px; margin-top: 1rem; border-left: 5px solid var(--primary); border-radius: 8px; box-shadow: 0 2px 8px var(--shadow); }
        .notification { padding: 15px; margin-bottom: 15px; border-radius: 8px; font-weight: 600; display: none; text-align: center; }
    </style>
</head>
<body data-theme="dark">

    <div id="app-container"></div>

    <nav class="bottom-nav">
        <button class="bottom-nav-item active" data-page="dashboard"><i class="fas fa-home"></i> <span>Home</span></button>
        <button class="bottom-nav-item" data-page="account"><i class="fas fa-user-circle"></i> <span>Akun</span></button>
    </nav>
    
    <template id="template-dashboard">
        <header id="header-dashboard"><h1>Asdar Store</h1></header>
        <div class="info-card" data-aos="fade-down">
            <div class="info-item">
                <span class="info-value" id="user-balance">Rp 0</span>
            </div>
        </div>
        <div class="section-container" data-aos="fade-up">
            <h2 class="section-title">Kategori Populer</h2>
            <div class="kategori-grid">
                <a href="#" class="kategori-item" data-category="PULSA"><div class="kategori-icon"><i class="fas fa-mobile-alt"></i></div><span>Pulsa</span></a>
                <a href="#" class="kategori-item" data-category="TOKEN LISTRIK"><div class="kategori-icon"><i class="fas fa-bolt"></i></div><span>Token PLN</span></a>
                <a href="#" class="kategori-item" data-category="VOUCHER GAME"><div class="kategori-icon"><i class="fas fa-gamepad"></i></div><span>Voucher Game</span></a>
                <a href="#" class="kategori-item" data-category="PAKET DATA"><div class="kategori-icon"><i class="fas fa-wifi"></i></div><span>Paket Data</span></a>
            </div>
        </div>
    </template>
    
    <template id="template-order">
        <header id="header-pesanan">
            <button class="back-btn"><i class="fas fa-arrow-left"></i></button>
            <h1>Formulir Pesanan</h1>
        </header>
        <div class="section-container" id="order-form-container">
            <div id="existing-order-notification" style="display: none;"></div>
            <form id="formPesanan">
                <div id="formNotification" class="notification"></div>
                <label for="nama">Nama Lengkap</label><input type="text" id="nama" required />
                <label for="nomor">Nomor HP / ID Game</label><input type="text" id="nomor" required />
                <label for="waAktif">Nomor WhatsApp Aktif</label><input type="tel" id="waAktif" pattern="^08[0-9]{8,15}$" required />
                <label for="kategori">Kategori</label><select id="kategori" required></select>
                <label for="produk">Produk</label><select id="produk" required></select>
                <div class="info" id="infoProduk"></div>
                <button type="button" id="nextToPaymentBtn" disabled>Lanjut</button>
            </form>
        </div>
        <div id="payment-selection-container" class="section-container" style="display: none;"></div>
    </template>
    
    <template id="template-account">
        <header id="header-pesanan"><button class="back-btn"><i class="fas fa-arrow-left"></i></button><h1>Akun Saya</h1></header>
        <div class="section-container" id="cek-status-container">
            <h2>Cek Status Pesanan</h2>
            <form id="cekStatusForm"><input type="text" id="idCek" required /><button type="submit">Cek</button></form>
        </div>
        <div class="section-container" id="auth-buttons-container"></div>
    </template>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        // === KONFIGURASI FIREBASE ===
        const firebaseConfig = {
            apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
            authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
            databaseURL: "https://asdarstoredigitalll-d89c4-default-rtdb.firebaseio.com",
            projectId: "asdarstoredigitalll-d89c4",
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const dbFS = firebase.firestore();

        // === STATE APLIKASI ===
        let currentUser = null;
        let allCategories = new Set();
        let allProducts = [];

        // === MANAJEMEN HALAMAN / ROUTER ===
        const appContainer = document.getElementById('app-container');
        
        const loadPage = (pageName) => {
            const template = document.getElementById(`template-${pageName}`);
            if (!template) return;
            
            const content = template.content.cloneNode(true);
            appContainer.innerHTML = '';
            appContainer.appendChild(content);
            AOS.init({ duration: 600, once: true, offset: 20 });
            
            // Jalankan fungsi inisialisasi untuk halaman yang sesuai
            if (pageName === 'dashboard') initDashboardPage();
            else if (pageName === 'order') initOrderPage();
            else if (pageName === 'account') initAccountPage();
        };

        const initDashboardPage = () => {
            if (currentUser) {
                document.getElementById('user-balance').textContent = currentUser.displayName || 'User';
            } else {
                document.getElementById('user-balance').textContent = 'Login';
            }
            document.querySelectorAll('.kategori-item').forEach(item => {
                item.addEventListener('click', e => {
                    e.preventDefault();
                    sessionStorage.setItem('selectedCategory', item.dataset.category);
                    loadPage('order');
                });
            });
        };
        
        const initOrderPage = () => {
            const backBtn = appContainer.querySelector('.back-btn');
            backBtn.addEventListener('click', () => loadPage('dashboard'));

            const fields = {
                kategori: document.getElementById('kategori'),
                produk: document.getElementById('produk'),
                nextBtn: document.getElementById('nextToPaymentBtn')
            };

            fields.kategori.addEventListener('change', () => handleCategoryChange(fields));
            fields.produk.addEventListener('change', () => handleProductSelection(fields));
            // Tambahkan event listener lain yang relevan di sini

            // Isi dropdown kategori
            fields.kategori.innerHTML = '<option value="">Pilih</option>';
            allCategories.forEach(cat => {
                fields.kategori.innerHTML += `<option value="${cat}">${cat}</option>`;
            });

            const selectedCategory = sessionStorage.getItem('selectedCategory');
            if (selectedCategory) {
                fields.kategori.value = selectedCategory;
                handleCategoryChange(fields); // Panggil langsung untuk memuat produk
            }
        };

        const initAccountPage = () => {
            const backBtn = appContainer.querySelector('.back-btn');
            backBtn.addEventListener('click', () => loadPage('dashboard'));

            const authContainer = document.getElementById('auth-buttons-container');
            if (currentUser) {
                authContainer.innerHTML = `<button id="logout-btn">Logout</button>`;
                document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());
            } else {
                authContainer.innerHTML = `<p>Silakan login untuk mengakses fitur lengkap.</p>`;
            }
            
            const cekStatusForm = document.getElementById('cekStatusForm');
            cekStatusForm.addEventListener('submit', event => {
                event.preventDefault();
                // Panggil fungsi cek status Anda di sini
                // const idCek = document.getElementById('idCek').value;
                // cekStatus(idCek);
                alert("Fitur cek status belum dihubungkan di UI baru ini.");
            });
        };
        
        // === LOGIKA INTI APLIKASI (FUNGSI-FUNGSI LAMA) ===
        const preloadData = async () => {
            const querySnapshot = await dbFS.collection('produk').get();
            querySnapshot.forEach(doc => {
                const data = doc.data();
                allProducts.push({ id: doc.id, ...data });
                if (data.kategori) allCategories.add(data.kategori.toUpperCase());
            });
        };

        const handleCategoryChange = (fields) => {
            const kategori = fields.kategori.value;
            fields.produk.innerHTML = '<option value="">Pilih</option>';
            if (!kategori) return;

            const productsInCategory = allProducts
                .filter(p => p.kategori.toUpperCase() === kategori)
                .sort((a, b) => (a.urutan || 0) - (b.urutan || 0));

            productsInCategory.forEach(prod => {
                fields.produk.innerHTML += `<option value="${prod.id}">${prod.nama_produk}</option>`;
            });
        };
        
        const handleProductSelection = (fields) => {
            const produkId = fields.produk.value;
            if (!produkId) return;
            
            const selectedProduct = allProducts.find(p => p.id === produkId);
            const infoEl = document.getElementById('infoProduk');
            const nextBtn = document.getElementById('nextToPaymentBtn');

            if (selectedProduct) {
                infoEl.innerHTML = `<b>Harga:</b> Rp ${selectedProduct.harga_umum}<br><b>Stok:</b> ${selectedProduct.stok}`;
                nextBtn.disabled = !selectedProduct.stok || selectedProduct.stok <= 0;
            }
        };

        // (Salin fungsi-fungsi penting lainnya dari kode lama Anda ke sini jika diperlukan)

        // === INISIALISASI APLIKASI ===
        document.querySelector('.bottom-nav').addEventListener('click', e => {
            const targetButton = e.target.closest('.bottom-nav-item');
            if (targetButton && !targetButton.classList.contains('active')) {
                loadPage(targetButton.dataset.page);
                document.querySelectorAll('.bottom-nav-item').forEach(btn => btn.classList.remove('active'));
                targetButton.classList.add('active');
            }
        });

        auth.onAuthStateChanged(user => {
            currentUser = user;
            // Muat ulang halaman saat status login berubah agar UI terupdate
            loadPage('dashboard');
        });

        // Jalankan saat halaman pertama kali dibuka
        document.addEventListener('DOMContentLoaded', async () => {
            await preloadData();
            loadPage('dashboard'); // Tampilkan halaman dashboard sebagai default
        });
    </script>
</body>
</html>
