<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Harga & Stok - Asdar Store</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1255/1255106.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #007BFF;
      --success-color: #28a745;
      --background-color: #f0f4f8;
      --card-background: #ffffff;
      --text-color: #333;
      --muted-text-color: #6c757d;
      --border-color: #e9ecef;
      --shadow: 0 8px 25px rgba(0,0,0,0.07);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes toastOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(100%); opacity: 0; } }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
      margin: 0;
    }
    .container { max-width: 700px; margin: 0 auto; padding: 1rem; }
    
    .store-header {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      margin-bottom: 2rem; animation: fadeIn 0.5s ease-out;
    }
    .store-header img.logo { width: 60px; height: 60px; margin-bottom: 0.5rem; }
    .store-header h1 { color: var(--primary-color); font-weight: 700; margin: 0; font-size: 2rem; }
    .store-header p { color: var(--muted-text-color); font-size: 1rem; margin: 0.3rem 0 0 0; }

    .card {
      background-color: var(--card-background); border-radius: 16px; padding: 1.5rem;
      box-shadow: var(--shadow); margin-bottom: 2rem; animation: fadeIn 0.6s ease-out;
    }
    .card h2 { font-size: 1.5rem; margin-top: 0; margin-bottom: 1.5rem; text-align: center; color: var(--text-color); display: flex; align-items: center; justify-content: center; gap: 0.75rem; }

    .about-section p { text-align: center; color: var(--muted-text-color); margin-bottom: 1.5rem; }
    .guarantee {
      display: flex; align-items: center; gap: 1rem; padding: 1rem;
      background-color: #e6f2ff; border-radius: 12px; color: #004085; text-align: left;
    }
    .guarantee i { font-size: 1.5rem; }

    #category-filters { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-bottom: 1.5rem; }
    .filter-btn {
      background-color: #fff; border: 1px solid var(--border-color); color: var(--muted-text-color);
      padding: 0.5rem 1.2rem; border-radius: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
    }
    .filter-btn.active { background-color: var(--primary-color); color: #fff; border-color: var(--primary-color); }
    .table-container { border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
    th { background-color: #e6f2ff; color: var(--primary-color); font-weight: 700; }
    tbody tr { cursor: pointer; transition: background-color 0.2s ease; }
    tbody tr:hover { background-color: #f8f9fa; }
    tbody tr.selected-row { background-color: #e6f2ff; font-weight: 600; }
    tr.unavailable { cursor: not-allowed; color: var(--muted-text-color); }
    #product-info-display { margin-top: 1.5rem; padding: 1.5rem; background-color: #f8f9fa; border-radius: 12px; animation: fadeIn 0.3s ease; }
    #product-info-display h3 { margin-top: 0; }
    #product-info-display p { margin: 0.5rem 0 1.5rem 0; }
    .buy-button { display: block; width: 100%; padding: 1rem; border: none; background-color: var(--success-color); color: white; font-size: 1.1rem; font-weight: 600; border-radius: 10px; cursor: pointer; }
    
    .testimonial { background-color: #f8f9fa; padding: 1rem; border-radius: 12px; margin-bottom: 1rem; }
    .testimonial p { margin: 0 0 0.5rem 0; font-style: italic; color: var(--text-color); }
    .testimonial .author { text-align: right; font-weight: 600; color: var(--primary-color); }

    .payment-method { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .payment-icon-img { width: 80px; height: auto; object-fit: contain; }
    .payment-details p { margin: 0; font-weight: 600; }
    .payment-details span { font-size: 0.9rem; }
    .copy-btn { margin-left: auto; background-color: #f0f0f0; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

    .footer { text-align: center; padding: 2rem 1rem; color: var(--muted-text-color); font-size: 0.9rem; }

    .toast-notification {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background-color: #333; color: white; padding: 15px 25px;
      border-radius: 10px; z-index: 2000; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      animation: toastIn 0.3s ease-out forwards;
    }
    .toast-notification.hide { animation: toastOut 0.3s ease-in forwards; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 1000; }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-content { background-color: #fff; padding: 2rem; border-radius: 16px; width: 90%; max-width: 400px; }
  </style>
</head>
<body>

  <div class="container">
    <header class="store-header">
      <img src="https://cdn-icons-png.flaticon.com/512/1255/1255106.png" alt="Logo Toko" class="logo">
      <h1 id="store-title"></h1>
      <p id="store-tagline"></p>
    </header>
    
    <div class="card about-section">
        <h2><i class="fas fa-store"></i> Selamat Datang!</h2>
        <p id="about-text"></p>
        <div class="guarantee">
            <i class="fas fa-shield-alt"></i>
            <div>
                <strong>Garansi Layanan Kami</strong><br>
                <span>Produk gagal dikirim? Kami ganti 100% atau uang Anda kembali. Kepuasan Anda adalah prioritas kami.</span>
            </div>
        </div>
    </div>

    <div class="card">
      <div id="category-filters"></div>
      <div class="table-container">
        <table>
          <thead><tr><th style="width: 70%;">Produk</th><th style="text-align: center;">Stok</th></tr></thead>
          <tbody id="product-table-body"></tbody>
        </table>
      </div>
      <div id="product-info-display" style="display: none;"></div>
    </div>
    
    <div class="card">
        <h2><i class="fas fa-comments"></i> Kata Pelanggan Kami</h2>
        <div id="testimonials-container"></div>
    </div>

    <div class="card">
      <h2><i class="fas fa-wallet"></i> Metode Pembayaran</h2>
      <div id="payment-info-container"></div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; <span id="current-year"></span> <span id="footer-store-name"></span>. Semua Hak Cipta Dilindungi.</p>
  </footer>

  <div class="modal-overlay" id="order-modal">
    <div class="modal-content">
        <h2 style="text-align:center; margin-top:0; margin-bottom: 1.5rem;">Masukkan Data Pesanan</h2>
        <form id="modal-form">
            <label id="target-label" for="target-input">Nomor Tujuan</label>
            <input type="text" id="target-input" placeholder="Contoh: 081234..." required style="width:100%; padding: 0.8rem; border-radius:8px; border:1px solid var(--border-color); box-sizing:border-box; margin-bottom: 1.5rem;">
            <button type="submit" style="width:100%; padding:0.8rem; border:none; background-color:var(--success-color); color:white; font-weight:600; border-radius:8px; cursor:pointer;">
                <i class="fab fa-whatsapp"></i> Kirim Pesanan & Info Bayar
            </button>
        </form>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
// ===================================================================================
// === PUSAT KONFIGURASI (UBAH SEMUA DI SINI) ===
// ===================================================================================
const CONFIG = {
  STORE_NAME: "Asdar Store",
  STORE_TAGLINE: "Pusat Kebutuhan Digital Terpercaya Sejak 2024",
  ABOUT_TEXT: "Kami menyediakan berbagai produk digital dengan proses yang cepat, aman, dan harga yang bersaing. Terima kasih telah mempercayai kami!",
  
  CONTACT: {
    WHATSAPP_NUMBER: "6281803004607",
  },
  
  PAYMENT: {
    DANA_NUMBER: "087755432880",
    DANA_NAME: "Ahmad Darul...",
    SHOPEEPAY_NUMBER: "081803004607",
    SHOPEEPAY_NAME: "Asriyatul H.",
    QRIS_IMAGE_URL: "https://iili.io/FgTQZNa.png"
  },
  
  TESTIMONIALS: [
      { author: "Budi S.", text: "Prosesnya cepet banget! Gak sampai 5 menit pulsa sudah masuk. Recommended seller!" },
      { author: "Ani W.", text: "Harganya murah-murah, stoknya juga selalu update di sini. Mantap!" },
      { author: "Putra D.", text: "Adminnya ramah dan fast response. Kalau ada masalah dibantu sampai tuntas. Terima kasih!" },
  ],

  FIREBASE_CONFIG: {
    apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
    authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
    databaseURL: "https://asdarstoredigitalll-d89c4-default-rtdb.firebaseio.com",
    projectId: "asdarstoredigitalll-d89c4",
  }
};
// ===================================================================================
// === AKHIR DARI PUSAT KONFIGURASI ===
// ===================================================================================

firebase.initializeApp(CONFIG.FIREBASE_CONFIG);
const db = firebase.firestore();

let allProducts = [], selectedProduct = null;
const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('store-title').textContent = CONFIG.STORE_NAME;
  document.getElementById('store-tagline').textContent = CONFIG.STORE_TAGLINE;
  document.getElementById('about-text').textContent = CONFIG.ABOUT_TEXT;
  const currentYear = new Date().getFullYear();
  document.getElementById('current-year').textContent = currentYear;
  document.getElementById('footer-store-name').textContent = CONFIG.STORE_NAME;
  
  renderPaymentInfo();
  renderTestimonials();
  
  loadProducts();
  setupEventListeners();
});

function renderPaymentInfo() { /* ... fungsi tidak berubah ... */ }
function renderTestimonials() { /* ... fungsi tidak berubah ... */ }
async function loadProducts() { /* ... fungsi tidak berubah ... */ }
function renderCategoryFilters() { /* ... fungsi tidak berubah ... */ }
function renderTable(category) { /* ... fungsi tidak berubah ... */ }
function handleRowClick(event) { /* ... fungsi tidak berubah ... */ }
function openOrderModal() { /* ... fungsi tidak berubah ... */ }

// ============================================================================
// === INI ADALAH FUNGSI YANG DIMODIFIKASI ===
// ============================================================================
function handleFormSubmit(event) {
    event.preventDefault();
    const targetNumber = document.getElementById('target-input').value.trim();
    if (!targetNumber) {
        alert('Harap isi data tujuan.');
        return;
    }

    // 1. Membuat bagian detail pesanan
    const orderDetails = `Halo Admin, saya mau pesan:

*Produk:* ${selectedProduct.nama_produk}
*Harga:* ${formatRupiah(selectedProduct.harga_umum)}
*No. Tujuan / ID:* ${targetNumber}`;

    // 2. Membuat bagian informasi pembayaran
    const paymentInstructions = `
---
*Silakan lakukan pembayaran ke salah satu rekening berikut:*

*DANA:*
- No: ${CONFIG.PAYMENT.DANA_NUMBER}
- a.n: ${CONFIG.PAYMENT.DANA_NAME}

*ShopeePay:*
- No: ${CONFIG.PAYMENT.SHOPEEPAY_NUMBER}
- a.n: ${CONFIG.PAYMENT.SHOPEEPAY_NAME}

*QRIS (Semua e-Wallet):*
${CONFIG.PAYMENT.QRIS_IMAGE_URL}

*Setelah transfer, mohon kirimkan bukti pembayaran di chat ini.*
Terima kasih.`;

    // 3. Menggabungkan keduanya menjadi satu pesan
    const finalMessage = `${orderDetails}\n${paymentInstructions}`;

    // 4. Membuat URL WhatsApp dan membukanya
    const whatsappURL = `https://wa.me/${CONFIG.CONTACT.WHATSAPP_NUMBER}?text=${encodeURIComponent(finalMessage)}`;
    window.open(whatsappURL, '_blank');
    
    // 5. Menutup modal dan memberi notifikasi
    document.getElementById('order-modal').classList.remove('show');
    showToast("Membuka WhatsApp... Lanjutkan pesanan Anda di sana.");
}
// ============================================================================
// === AKHIR DARI FUNGSI YANG DIMODIFIKASI ===
// ============================================================================


function setupEventListeners() {
    document.getElementById('product-table-body').addEventListener('click', handleRowClick);
    document.getElementById('product-info-display').addEventListener('click', (e) => {
        if (e.target.classList.contains('buy-button')) openOrderModal();
    });
    document.getElementById('modal-form').addEventListener('submit', handleFormSubmit);
    document.getElementById('order-modal').addEventListener('click', (e) => {
        if (e.target.id === 'order-modal') e.target.classList.remove('show');
    });
}

function copyToClipboard(text, element) {
    navigator.clipboard.writeText(text).then(() => {
        const originalText = element.textContent;
        element.textContent = 'Disalin!';
        setTimeout(() => { element.textContent = originalText; }, 2000);
    }).catch(err => console.error('Gagal menyalin'));
}

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.classList.add('hide');
        toast.addEventListener('animationend', () => toast.remove());
    }, 3000);
}

// Tambahkan kembali fungsi-fungsi yang tidak berubah agar lengkap
function renderPaymentInfo() {
  const container = document.getElementById('payment-info-container');
  container.innerHTML = `
    <div class="payment-method">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Logo_dana_blue.svg/2560px-Logo_dana_blue.svg.png" class="payment-icon-img" alt="Logo DANA">
      <div class="payment-details"><p>DANA</p><span>${CONFIG.PAYMENT.DANA_NUMBER} (a.n ${CONFIG.PAYMENT.DANA_NAME})</span></div>
      <button class="copy-btn" onclick="copyToClipboard('${CONFIG.PAYMENT.DANA_NUMBER}', this)">Salin</button>
    </div>
    <div class="payment-method">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Shopee.svg/1200px-Shopee.svg.png" class="payment-icon-img" alt="Logo ShopeePay">
      <div class="payment-details"><p>ShopeePay</p><span>${CONFIG.PAYMENT.SHOPEEPAY_NUMBER} (a.n ${CONFIG.PAYMENT.SHOPEEPAY_NAME})</span></div>
      <button class="copy-btn" onclick="copyToClipboard('${CONFIG.PAYMENT.SHOPEEPAY_NUMBER}', this)">Salin</button>
    </div>
    <div class="payment-method">
      <i class="fas fa-qrcode" style="font-size: 2.5rem; width: 80px; text-align: center;"></i>
      <div class="payment-details"><p>QRIS (Semua e-Wallet)</p><span><a href="${CONFIG.PAYMENT.QRIS_IMAGE_URL}" target="_blank" style="font-weight: 600;">Lihat Kode QRIS</a></span></div>
    </div>`;
}
function renderTestimonials() {
    const container = document.getElementById('testimonials-container');
    container.innerHTML = CONFIG.TESTIMONIALS.map(testi => `<div class="testimonial"><p>"${testi.text}"</p><div class="author">- ${testi.author}</div></div>`).join('');
}
async function loadProducts() {
    const tableBody = document.getElementById('product-table-body');
    try {
        const snapshot = await db.collection('produk').orderBy('urutan', 'asc').get();
        allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderCategoryFilters();
        if (document.querySelector('.filter-btn')) {
            document.querySelector('.filter-btn').click();
        }
    } catch (error) { console.error("Gagal memuat produk:", error); tableBody.innerHTML = `<tr><td colspan="2" style="text-align: center;">Gagal memuat data.</td></tr>`; }
}
function renderCategoryFilters() {
    const categories = [...new Set(allProducts.map(p => p.kategori).filter(Boolean))];
    const container = document.getElementById('category-filters');
    container.innerHTML = '';
    categories.forEach(category => {
        const button = document.createElement('button');
        button.className = 'filter-btn';
        button.textContent = category;
        button.dataset.category = category;
        button.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            renderTable(category);
            document.getElementById('product-info-display').style.display = 'none';
        });
        container.appendChild(button);
    });
}
function renderTable(category) {
    const products = allProducts.filter(p => p.kategori === category);
    const tableBody = document.getElementById('product-table-body');
    tableBody.innerHTML = '';
    products.forEach(prod => {
        const isAvailable = prod.stok > 0;
        const stockHTML = isAvailable ? `<div class="stock-status" style="color:var(--success-color);"><i class="fas fa-check-circle"></i> ${prod.stok}</div>` : `<div class="stock-status" style="color:var(--danger-color);"><i class="fas fa-times-circle"></i> Habis</div>`;
        const row = document.createElement('tr');
        row.dataset.id = prod.id;
        if (!isAvailable) row.classList.add('unavailable');
        row.innerHTML = `<td>${prod.nama_produk} - [${formatRupiah(prod.harga_umum)}]</td><td style="text-align: center;">${stockHTML}</td>`;
        tableBody.appendChild(row);
    });
}
function handleRowClick(event) {
    const row = event.target.closest('tr');
    if (!row || row.classList.contains('unavailable')) return;
    document.querySelectorAll('tr').forEach(r => r.classList.remove('selected-row'));
    row.classList.add('selected-row');
    selectedProduct = allProducts.find(p => p.id === row.dataset.id);
    const infoBox = document.getElementById('product-info-display');
    infoBox.innerHTML = `<h3>${selectedProduct.nama_produk}</h3><p>${selectedProduct.deskripsi || 'Tidak ada deskripsi untuk produk ini.'}</p><button class="buy-button"><i class="fas fa-shopping-cart"></i> Beli Produk Ini</button>`;
    infoBox.style.display = 'block';
    infoBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function openOrderModal() {
    const modal = document.getElementById('order-modal');
    const label = document.getElementById('target-label');
    const input = document.getElementById('target-input');
    const category = selectedProduct.kategori.toLowerCase();
    if (category.includes('tv') || category.includes('kvision')) {
        label.textContent = "No. SN / ID Pelanggan TV";
        input.placeholder = "Contoh: 3001234567";
    } else if (category.includes('data') || category.includes('pulsa')) {
        label.textContent = "Nomor HP Tujuan";
        input.placeholder = "Contoh: 081234567890";
    } else {
        label.textContent = "ID Tujuan";
        input.placeholder = "Masukkan ID atau nomor tujuan";
    }
    input.value = '';
    modal.classList.add('show');
}
</script>
</body>
                  </html>
