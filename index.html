<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asdar Store Digital</title>
  <link rel="icon" href="favicon.png" />
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1abc9c" /> 

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f7fa; --text: #2c3e50; --primary: #3498db;
      --card: #ffffff; --border: #e8eef3; --shadow: rgba(44, 62, 80, 0.08);
      --success: #28a745; --danger: #e74c3c; --warning: #f39c12;
      --muted-text: #7f8c8d;
    }
    [data-theme="dark"] {
      --bg: #161828; --text: #e0e0e0; --primary: #1abc9c;
      --card: #252840; --border: #363a55; --shadow: rgba(0, 0, 0, 0.15);
      --muted-text: #8a93a2;
    }
    body {
      font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
      margin: 0; line-height: 1.6;
      /* Padding bawah agar konten tidak tertutup bottom nav */
      padding-bottom: 100px;
    }
    main { max-width: 700px; margin: 0 auto; padding: 20px; }

    /* HEADER BARU */
    #header-baru {
      background-color: var(--primary);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 1000;
    }
    #header-baru i { font-size: 20px; }
    #header-baru span { font-size: 20px; font-weight: 600; }
    #header-baru a { color: white; text-decoration: none; }
    
    /* KARTU INFORMASI PENGGUNA */
    .info-card {
      background: var(--card);
      border-radius: 12px;
      padding: 15px;
      margin-top: -30px; /* Trik agar kartu sedikit menjorok ke atas header */
      position: relative;
      z-index: 999;
      box-shadow: 0 10px 25px var(--shadow);
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }
    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .info-item a { text-decoration: none; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .info-item .icon-bg {
      width: 45px; height: 45px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ecf0f1;
      color: var(--primary);
      font-size: 20px;
    }
    .info-item .icon-bg.primary { background-color: var(--primary); color: white; }
    .info-item .icon-bg.warning { background-color: var(--warning); color: white; }
    .info-label { font-size: 12px; color: var(--muted-text); }
    .info-value { font-size: 16px; font-weight: 600; }
    .info-action { font-size: 14px; font-weight: 500; }

    /* BANNER PROMOSI */
    .promo-banner {
      background: linear-gradient(90deg, #3498db, #1abc9c);
      border-radius: 12px;
      margin-top: 25px;
      color: white;
      padding: 20px;
    }
    .banner-content h3 { margin: 0; font-size: 18px; }
    .banner-content p { margin: 5px 0 0; opacity: 0.9; }

    /* GRID KATEGORI */
    .kategori-container { margin-top: 25px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
    .kategori-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 kolom */
      gap: 15px;
    }
    .kategori-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: var(--text);
    }
    .kategori-icon {
      width: 60px; height: 60px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 8px;
      transition: transform 0.2s ease;
    }
    .kategori-item:hover .kategori-icon { transform: scale(1.1); }
    .kategori-item span { font-size: 12px; font-weight: 500; }

    /* NAVIGASI BAWAH */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      max-width: 700px; margin: 0 auto; /* agar center di layar lebar */
      background: var(--card);
      display: flex;
      justify-content: space-around;
      box-shadow: 0 -5px 20px var(--shadow);
      border-top: 1px solid var(--border);
      z-index: 1001;
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px;
      text-decoration: none;
      color: var(--muted-text);
      gap: 4px;
      transition: color 0.2s ease;
    }
    .bottom-nav-item i { font-size: 20px; }
    .bottom-nav-item span { font-size: 12px; }
    .bottom-nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>

<body data-theme="dark">

  <header id="header-baru">
    <i class="fas fa-bars"></i>
    <span>Asdar Store</span>
    <a href="#" class="header-link">
      <i class="fas fa-headset"></i>
    </a>
  </header>

  <main id="main-content">
    
    <div class="info-card" data-aos="fade-down">
      <div class="info-item">
        <div class="icon-bg"><i class="fas fa-wallet"></i></div>
        <span class="info-label">Saldo Anda</span>
        <span class="info-value">Rp 0</span>
      </div>
      <div class="info-item">
        <a href="#">
          <div class="icon-bg primary"><i class="fas fa-plus-circle"></i></div>
          <span class="info-action">Deposit</span>
        </a>
      </div>
      <div class="info-item">
        <a href="#">
          <div class="icon-bg warning"><i class="fas fa-bell"></i></div>
          <span class="info-action">Notifikasi</span>
        </a>
      </div>
    </div>

    <div class="promo-banner" data-aos="fade-up">
      <div class="banner-content">
        <h3>Transaksi Lancar & Aman</h3>
        <p>Bersama Asdar Store Digital</p>
      </div>
    </div>

    <div class="kategori-container" data-aos="fade-up" data-aos-delay="200">
      <h2 class="section-title">Kategori</h2>
      <div class="kategori-grid">
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #3498db33; color: #3498db;"><i class="fas fa-mobile-alt"></i></div>
          <span>Pulsa</span>
        </a>
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #2ecc7133; color: #2ecc71;"><i class="fas fa-bolt"></i></div>
          <span>Token PLN</span>
        </a>
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #f1c40f33; color: #f1c40f;"><i class="fas fa-gamepad"></i></div>
          <span>Voucher Game</span>
        </a>
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #e74c3c33; color: #e74c3c;"><i class="fas fa-wifi"></i></div>
          <span>Paket Data</span>
        </a>
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #9b59b633; color: #9b59b6;"><i class="fas fa-wallet"></i></div>
          <span>E-Wallet</span>
        </a>
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #1abc9c33; color: #1abc9c;"><i class="fas fa-motorcycle"></i></div>
          <span>Ojek Online</span>
        </a>
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #e67e2233; color: #e67e22;"><i class="fas fa-tv"></i></div>
          <span>Voucher TV</span>
        </a>
        <a href="#" class="kategori-item">
          <div class="kategori-icon" style="background-color: #7f8c8d33; color: #7f8c8d;"><i class="fas fa-ellipsis-h"></i></div>
          <span>Lainnya</span>
        </a>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="#" class="bottom-nav-item active">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a href="#" class="bottom-nav-item">
      <i class="fas fa-history"></i>
      <span>Transaksi</span>
    </a>
    <a href="#" class="bottom-nav-item">
      <i class="fas fa-money-bill-wave"></i>
      <span>Saldo</span>
    </a>
    <a href="#" class="bottom-nav-item">
      <i class="fas fa-user-circle"></i>
      <span>Akun</span>
    </a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // Inisialisasi AOS untuk animasi
    AOS.init({ duration: 800, once: true, offset: 50 });

    // TODO: Tambahkan JavaScript baru di sini untuk membuat tombol-tombol berfungsi.
    // Kode JavaScript Anda yang lama untuk form pemesanan tidak relevan lagi dengan UI ini.
    
  </script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker berhasil didaftarkan: ', registration.scope);
          })
          .catch(err => {
            console.log('Pendaftaran ServiceWorker gagal: ', err);
          });
      });
    }
  </script>
</body>
</html>
