<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asdar Store Digital</title>
  <link rel="icon" href="favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f9; --text: #2c3e50; --primary: #3498db;
      --card: #ffffff; --border: #e0e0e0; --shadow: rgba(0, 0, 0, 0.05);
      --success: #28a745; --danger: #e74c3c; --muted-text: #6c757d;
    }
    [data-theme="dark"] {
      --bg: #1a1a2e; --text: #e0e0e0; --primary: #1abc9c;
      --card: #2c2c40; --border: #444; --shadow: rgba(0, 0, 0, 0.15);
      --muted-text: #8a93a2;
    }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    header {
      position: sticky; top: 0; background: var(--card); padding: 10px 15px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); z-index: 1000;
    }
    main { max-width: 700px; margin: 20px auto; padding: 0 15px; }
    .section-container { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 12px var(--shadow); margin-top: 20px; }
    h2 { color: var(--primary); margin-bottom: 20px; text-align: center; }
    
    /* Header Baru dengan Saldo */
    .header-wallet { display: flex; align-items: center; gap: 15px; }
    .wallet-balance { background: var(--bg); padding: 5px 15px; border-radius: 50px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .wallet-balance .fa-wallet { color: var(--primary); }
    .deposit-btn { background: var(--success); color: white; padding: 5px 12px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 0.9em; display: flex; align-items: center; gap: 5px; }
    
    /* Grid Kategori */
    #category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .category-item { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--card); padding: 15px 5px; border-radius: 12px; text-align: center; cursor: pointer; transition: transform 0.2s ease; border: 1px solid var(--border); }
    .category-item.active { background: var(--primary); color: white; border-color: var(--primary); }
    .category-item.active .category-icon, .category-item.active .category-name { color: white; }
    .category-icon { font-size: 24px; color: var(--primary); margin-bottom: 8px; }
    .category-name { font-size: 12px; font-weight: 600; }

    /* Modal Deposit */
    #deposit-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1001; }
    #deposit-modal-content { background: var(--card); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
  </style>
</head>

<body>
<header id="header">
    <div id="user-panel-left">
        <a href="login.html" class="btn btn-primary btn-sm">Login/Daftar</a>
    </div>
    <div id="user-panel-right" class="header-wallet" style="display: none;">
        <div class="wallet-balance">
            <i class="fas fa-wallet"></i>
            <span id="balance-amount">Rp 0</span>
        </div>
        <a href="#" id="btn-show-deposit" class="deposit-btn"><i class="fas fa-plus"></i> Deposit</a>
    </div>
</header>
  
<main id="main-content">
    <div class="section-container" data-aos="fade-up">
        <h2>Kategori Produk</h2>
        <div id="category-grid"></div>
    </div>
    
    <div data-aos="fade-up" class="section-container" id="order-form-container" style="display: none;">
      <h2 id="form-title">Pilih Produk</h2>
      <div id="product-selection-area"></div>
      <div id="customer-data-area" style="display:none;">
            <label for="nomor">Nomor HP / ID Game</label>
            <input type="text" id="nomor" class="form-control" placeholder="Cth: 081234567890" required />
      </div>
      <button type="button" id="purchaseBtn" class="btn btn-primary w-100 mt-3" disabled>Bayar dengan Saldo</button>
    </div>
</main>

<!-- Modal Deposit -->
<div id="deposit-modal">
    <div id="deposit-modal-content">
        <h3>Isi Saldo Deposit</h3>
        <p>Masukkan jumlah deposit (minimal Rp 10.000) dan lakukan transfer manual.</p>
        <input type="number" id="deposit-amount" class="form-control" placeholder="10000" min="10000" />
        <button id="btn-process-deposit" class="btn btn-success w-100 mt-2">Buat Tiket Deposit</button>
        <button id="btn-close-deposit" class="btn btn-secondary w-100 mt-2">Batal</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    AOS.init({ duration: 800, once: true, offset: 50 });

    const firebaseConfig = { /* ... Konfigurasi Firebase Anda ... */ };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const functions = firebase.functions();

    const userPanelLeft = document.getElementById('user-panel-left');
    const userPanelRight = document.getElementById('user-panel-right');
    const balanceAmountEl = document.getElementById('balance-amount');
    const depositModal = document.getElementById('deposit-modal');
    
    let currentUser = null;
    let produkTerpilihData = null;
    let unsubscribeWallet = null;

    const categoryIcons = { /* ... Pemetaan ikon Anda ... */ };

    auth.onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
            userPanelLeft.style.display = 'none';
            userPanelRight.style.display = 'flex';
            listenToWalletChanges(user.uid);
        } else {
            userPanelLeft.style.display = 'block';
            userPanelRight.style.display = 'none';
            balanceAmountEl.innerText = 'Rp 0';
            if (unsubscribeWallet) unsubscribeWallet();
        }
    });

    function listenToWalletChanges(userId) {
        if (unsubscribeWallet) unsubscribeWallet();
        unsubscribeWallet = db.collection('wallets').doc(userId)
            .onSnapshot(doc => {
                const balance = doc.exists ? (doc.data().balance || 0) : 0;
                balanceAmountEl.innerText = `Rp ${balance.toLocaleString('id-ID')}`;
            }, console.error);
    }

    document.getElementById('btn-show-deposit').addEventListener('click', () => depositModal.style.display = 'flex');
    document.getElementById('btn-close-deposit').addEventListener('click', () => depositModal.style.display = 'none');
    
    document.getElementById('btn-process-deposit').addEventListener('click', async () => {
        const amount = document.getElementById('deposit-amount').value;
        if (!currentUser) { alert("Silakan login terlebih dahulu."); return; }
        if (!amount || amount < 10000) { alert("Jumlah deposit minimal Rp 10.000"); return; }

        const btn = document.getElementById('btn-process-deposit');
        btn.disabled = true;
        btn.innerText = "Memproses...";

        try {
            const requestDeposit = functions.httpsCallable('requestManualDeposit');
            const result = await requestDeposit({ amount: parseInt(amount) });
            
            depositModal.style.display = 'none';
            alert(`${result.data.message}\n\nID Deposit Anda: ${result.data.depositId}\n\nSilakan transfer sejumlah Rp ${parseInt(amount).toLocaleString('id-ID')} ke rekening kami dan upload bukti pembayaran di halaman status pesanan/deposit.`);
            
        } catch (error) {
            alert(`Error: ${error.message}`);
        } finally {
            btn.disabled = false;
            btn.innerText = "Buat Tiket Deposit";
        }
    });
    
    document.getElementById('purchaseBtn').addEventListener('click', async () => {
        if (!currentUser || !produkTerpilihData) return;
        const nomorTujuan = document.getElementById('nomor').value;
        if (!nomorTujuan) { alert("Masukkan nomor tujuan."); return; }
        
        const productPrice = produkTerpilihData.harga_reseller || produkTerpilihData.harga_umum;
        if (!confirm(`Bayar ${produkTerpilihData.nama_produk} seharga Rp ${productPrice.toLocaleString('id-ID')} dengan saldo?`)) return;

        const btn = document.getElementById('purchaseBtn');
        btn.disabled = true;
        btn.innerText = "Memproses...";

        try {
            const purchaseFunction = functions.httpsCallable('purchaseWithBalance');
            const result = await purchaseFunction({ productId: produkTerpilihData.id, nomorTujuan });
            alert(result.data.message);
            document.getElementById('order-form-container').style.display = 'none';
        } catch (error) {
            alert(`Error: ${error.message}`);
        } finally {
            btn.disabled = false;
            btn.innerText = "Bayar dengan Saldo";
        }
    });

    // ... Tempelkan fungsi loadAndDisplayCategories, handleCategoryClick, handleProductSelection dari kode sebelumnya di sini ...
</script>
</body>
</html>
