<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesan Produk - Asdar Store Digital</title>
  <link rel="icon" href="favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f9f9; --text: #2c3e50; --primary: #3498db;
      --card: #ffffff; --border: #ddd; --shadow: rgba(0, 0, 0, 0.05);
      --success: #28a745; --danger: #e74c3c;
      --muted-text: #6c757d;
    }
    [data-theme="dark"] {
      --bg: #1a1a2e; --text: #e0e0e0; --primary: #1abc9c;
      --card: #2c2c40; --border: #444; --shadow: rgba(0, 0, 0, 0.15);
      --muted-text: #8a93a2;
    }
    body {
      font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease; margin: 0; line-height: 1.6;
    }
    header {
      position: sticky; top: 0; background: var(--card); padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); z-index: 999;
    }
    header h1 { margin: 0; font-size: 24px; color: var(--primary); }
    main { max-width: 700px; margin: 20px auto; padding: 0 20px; }
    label { font-weight: 600; margin-top: 15px; display: block; }
    input, select, textarea {
      width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px;
      border-radius: 8px; border: 1px solid var(--border); background-color: var(--card); color: var(--text);
    }
    button {
      width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px;
      border: none; background: var(--primary); color: white; cursor: pointer;
      font-weight: bold; font-size: 16px; transition: all 0.2s ease;
    }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    .info {
      background: var(--card); padding: 15px; margin-top: 1rem;
      border-left: 5px solid var(--primary); border-radius: 8px; box-shadow: 0 2px 8px var(--shadow);
    }
    .section-container {
      background: var(--card); padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow); margin-top: 20px;
    }
    h2 { color: var(--primary); margin-top: 30px; margin-bottom: 20px; text-align: center; }
    .header-right a { display: inline-flex; align-items: center; gap: 8px; color: white; padding: 8px 16px; border-radius: 50px; font-size: 0.9em; font-weight: 600; text-decoration: none; transition: all 0.2s ease-in-out; background-color: var(--primary); }
    .header-right a:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    
    .payment-option input[type="radio"] { display: none; }
    .payment-option label { display: block; padding: 15px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s ease-in-out; font-weight: 600; margin-top: 10px; }
    .payment-option label:hover { border-color: var(--primary); }
    .payment-option input[type="radio"]:checked + label { background-color: var(--primary); border-color: var(--primary); color: white; }
    .payment-content { border: 1px solid var(--border); padding: 20px; margin-top: 15px; border-radius: 8px; background-color: var(--bg); }
    .hidden { display: none; }
    .qris-details { text-align: center; padding: 15px; }
    .qris-image { max-width: 250px; width: 100%; height: auto; margin-bottom: 10px; border-radius: 8px; }
    .payment-methods-list { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .payment-method-item { background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .payment-details { line-height: 1.4; }
    .payment-method-name { font-weight: 600; font-size: 1.1em; color: var(--text); }
    .payment-method-number { font-size: 1em; font-weight: 500; color: var(--primary); }
    .payment-method-an { font-size: 0.85em; color: var(--muted-text); }
    .copy-btn { background-color: transparent; border: 1px solid var(--border); color: var(--muted-text); padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
  </style>
</head>

<body data-theme="dark">
<header id="header">
    <h1>Asdar Store Digital</h1>
    <div class="header-right">
        <a href="index.html"><i class="fas fa-home"></i> Beranda</a>
    </div>
</header>
  
<main id="main-content">
    <div data-aos="fade-up" class="section-container" id="order-form-container">
      <h2>Formulir Pemesanan</h2>
      <form id="formPesanan">
        <label for="kategori">Kategori Produk</label>
        <select id="kategori" required><option value="">Memuat kategori...</option></select>
        
        <label for="produk">Produk</label>
        <select id="produk" required><option value="">Pilih Kategori Dahulu</option></select>
        
        <div class="info" id="infoProduk">Deskripsi dan harga akan muncul di sini.</div>
        
        <hr>

        <label for="nomor">Nomor Tujuan / ID Game</label>
        <input type="text" id="nomor" placeholder="Cth: 081234567890 atau 123456789" required />
        
        <label for="waAktif">Nomor WhatsApp Aktif</label>
        <input type="tel" id="waAktif" placeholder="Cth: 081234567890 (awali 08...)" pattern="^08[0-9]{8,15}$" required />
        
        <button type="button" id="nextToPaymentBtn" disabled>Pilih Produk Dahulu</button>
      </form>
    </div>

    <div id="payment-selection-container" class="section-container" style="display: none;" data-aos="fade-up">
        </div>
</main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true, offset: 50 });

    const firebaseConfig = {
      apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
      authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
      databaseURL: "https://asdarstoredigitalll-d89c4-default-rtdb.firebaseio.com",
      projectId: "asdarstoredigitalll-d89c4",
    };
    firebase.initializeApp(firebaseConfig);
    const dbFS = firebase.firestore();

    const kategoriSelect = document.getElementById('kategori');
    const produkSelect = document.getElementById('produk');
    const infoProduk = document.getElementById('infoProduk');
    const nextToPaymentBtn = document.getElementById('nextToPaymentBtn');
    let produkTerpilihData = null;

    const formatRupiah = (angka) => `Rp${(angka || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".")}`;

    // === FUNGSI UTAMA FORMULIR ===

    async function loadCategories() {
        try {
            const snapshot = await dbFS.collection('produk').get();
            const categories = new Set();
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.kategori) categories.add(data.kategori);
            });
            
            kategoriSelect.innerHTML = '<option value="">Pilih Kategori</option>';
            categories.forEach(kategori => {
                kategoriSelect.innerHTML += `<option value="${kategori}">${kategori}</option>`;
            });

            // ***BAGIAN PENTING: OTOMATIS MEMILIH KATEGORI DARI URL***
            const urlParams = new URLSearchParams(window.location.search);
            const preselectedCategory = urlParams.get('kategori');
            if (preselectedCategory) {
                kategoriSelect.value = preselectedCategory;
                handleCategoryChange(); // Langsung jalankan fungsi untuk memuat produk
            }
            // ***AKHIR BAGIAN PENTING***

        } catch (error) {
            kategoriSelect.innerHTML = '<option value="">Gagal memuat</option>';
        }
    }
    
    async function handleCategoryChange() {
        const kategori = kategoriSelect.value;
        produkSelect.innerHTML = '<option value="">Memuat produk...</option>';
        infoProduk.innerHTML = 'Deskripsi dan harga akan muncul di sini.';
        nextToPaymentBtn.disabled = true;
        nextToPaymentBtn.textContent = 'Pilih Produk Dahulu';
        produkTerpilihData = null;

        if (!kategori) {
            produkSelect.innerHTML = '<option value="">Pilih Kategori Dahulu</option>';
            return;
        }

        try {
            const snapshot = await dbFS.collection('produk').where('kategori', '==', kategori).get();
            if(snapshot.empty){
                produkSelect.innerHTML = '<option value="">Produk tidak ada</option>';
                return;
            }

            produkSelect.innerHTML = '<option value="">Pilih Produk</option>';
            snapshot.forEach(doc => {
                const prod = doc.data();
                produkSelect.innerHTML += `<option value="${doc.id}">${prod.nama_produk}</option>`;
            });

             // ***BAGIAN PENTING: OTOMATIS MEMILIH PRODUK DARI URL***
             const urlParams = new URLSearchParams(window.location.search);
             const preselectedProduct = urlParams.get('produk');
             if (preselectedProduct) {
                produkSelect.value = preselectedProduct;
                handleProductSelection();
             }
             // ***AKHIR BAGIAN PENTING***

        } catch(error) {
            produkSelect.innerHTML = '<option value="">Gagal memuat</option>';
        }
    }

    async function handleProductSelection() {
        const produkId = produkSelect.value;
        if (!produkId) {
            infoProduk.innerHTML = 'Deskripsi dan harga akan muncul di sini.';
            nextToPaymentBtn.disabled = true;
            nextToPaymentBtn.textContent = 'Pilih Produk Dahulu';
            produkTerpilihData = null;
            return;
        }

        try {
            const doc = await dbFS.collection('produk').doc(produkId).get();
            if (!doc.exists) {
                infoProduk.innerHTML = 'Produk tidak ditemukan.';
                return;
            }
            produkTerpilihData = { id: doc.id, ...doc.data() };
            
            let hargaHTML = `<b style="font-size: 1.2em;">Harga: ${formatRupiah(produkTerpilihData.harga_umum)}</b>`;
            let stokStatus = `<b>Stok:</b> ${produkTerpilihData.stok || 'Tersedia'}`;

            if(produkTerpilihData.stok <= 0) {
                nextToPaymentBtn.disabled = true;
                nextToPaymentBtn.textContent = 'Stok Habis';
                stokStatus = `<b class="text-danger">Stok Habis</b>`
            } else {
                nextToPaymentBtn.disabled = false;
                nextToPaymentBtn.textContent = 'Lanjut ke Pembayaran';
            }

            infoProduk.innerHTML = `${hargaHTML}<hr style="margin: 10px 0;"><b>Deskripsi:</b> ${produkTerpilihData.deskripsi || '-'}<br>${stokStatus}`;

        } catch (error) {
            infoProduk.innerHTML = 'Gagal memuat detail produk.';
        }
    }

    // === EVENT LISTENERS ===
    document.addEventListener('DOMContentLoaded', loadCategories);
    kategoriSelect.addEventListener('change', handleCategoryChange);
    produkSelect.addEventListener('change', handleProductSelection);
    nextToPaymentBtn.addEventListener('click', () => {
      alert("Fungsi pembayaran belum diimplementasikan di contoh ini. Data yang dipilih:\nKategori: " + kategoriSelect.value + "\nProduk: " + produkTerpilihData.nama_produk);
    });

  </script>
</body>
</html>
