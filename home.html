<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asdar Store Digital - Beranda</title>
  <link rel="icon" href="favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f9f9; --text: #2c3e50; --primary: #3498db;
      --card: #ffffff; --border: #ddd; --shadow: rgba(0, 0, 0, 0.05);
      --success: #28a745; --danger: #e74c3c;
      --muted-text: #6c757d;
    }
    [data-theme="dark"] {
      --bg: #1a1a2e; --text: #e0e0e0; --primary: #1abc9c;
      --card: #2c2c40; --border: #444; --shadow: rgba(0, 0, 0, 0.15);
      --muted-text: #8a93a2;
    }
    body {
      font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease; margin: 0; line-height: 1.6;
    }
    header {
      position: sticky; top: 0; background: var(--card); padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); z-index: 999; transition: box-shadow 0.3s ease;
    }
    header h1 { margin: 0; font-size: 24px; color: var(--primary); }
    main { max-width: 800px; margin: 20px auto; padding: 0 20px; }
    .section-container {
      background: var(--card); padding: 25px; border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow); margin-top: 20px;
    }
    hr { margin: 40px 0; border: 0; border-top: 1px solid var(--border); }
    h2 { color: var(--primary); margin-top: 30px; margin-bottom: 20px; text-align: center; font-weight: 700; }
    
    /* Category Grid Menu Styles */
    .kategori-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 25px;
      text-align: center;
    }
    .kategori-item {
      background: var(--card);
      border-radius: 12px;
      padding: 20px 10px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 4px 12px var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
    }
    .kategori-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      color: var(--primary);
    }
    .kategori-item i {
      font-size: 2.2em;
      margin-bottom: 12px;
      color: var(--primary);
      width: 50px;
      height: 50px;
      line-height: 50px;
      border-radius: 50%;
      background: var(--bg);
    }
    .kategori-item span {
      font-weight: 600;
      font-size: 0.95em;
    }
    
    /* Featured Products Styles */
    .produk-populer-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }
    .product-card {
        background-color: var(--card); border-radius: 12px; overflow: hidden;
        box-shadow: 0 4px 12px var(--shadow); display: flex; flex-direction: column;
        transition: transform 0.2s ease;
    }
    .product-card:hover { transform: translateY(-5px); }
    .product-card-content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
    .product-card-title { font-weight: 600; margin-bottom: 5px; }
    .product-card-price { color: var(--success); font-weight: 700; font-size: 1.1em; margin-top: auto; }
    .product-card-button { display: block; background-color: var(--primary); color: white !important; text-align: center; padding: 10px; text-decoration: none; font-weight: bold; transition: background-color 0.2s; }
    .product-card-button:hover { background-color: #2980b9; }

    /* Banner & User Panel */
    #banner-container { width: 100%; margin-bottom: 20px; }
    .banner-item { display: block; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px var(--shadow); }
    .banner-image { width: 100%; display: block; vertical-align: middle; }
    .header-right { display: flex; gap: 10px; }
    .header-right a { display: inline-flex; align-items: center; gap: 8px; color: white; padding: 8px 16px; border-radius: 50px; font-size: 0.9em; font-weight: 600; text-decoration: none; transition: all 0.2s ease-in-out; }
    .header-right a:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .login-btn { background-color: var(--success); }
    .logout-btn { background-color: var(--danger); }
    .dashboard-btn { background-color: var(--primary); }

    /* Testimoni & FAQ */
    #testimoniContainer { background: var(--bg); border-radius: 12px; padding: 15px; height: 350px; overflow-y: auto; border: 1px solid var(--border); }
    .testimonial-bubble { background-color: var(--card); color: var(--text); padding: 12px 18px; border-radius: 20px; max-width: 85%; align-self: flex-start; box-shadow: 0 4px 8px rgba(0,0,0,0.07); }
    .faq-item { border-bottom: 1px solid var(--border); padding: 15px 0; }
    .faq-question { cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .faq-item.active .faq-answer { padding-top: 15px; max-height: 500px; }
    .faq-item.active .faq-question::after { transform: rotate(180deg); }
    .faq-question::after { content: '▼'; font-size: 12px; transition: transform 0.3s ease; }
    
    /* Status Check Form */
    input { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--bg); color: var(--text); }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
  </style>
</head>

<body data-theme="dark">
<header id="header">
    <h1>Asdar Store Digital</h1>
    <div id="user-panel" class="header-right">
        <a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i><span>Login/Daftar</span></a>
    </div>
</header>
  
<main id="main-content">
    <div id="banner-container" data-aos="fade-down"></div>
    
    <div data-aos="fade-up">
        <h2>Kategori Produk</h2>
        <div id="kategori-container" class="kategori-container">
            </div>
    </div>
    
    <hr>
    
    <div data-aos="fade-up">
        <h2>Produk Populer</h2>
        <div id="produk-populer-container" class="produk-populer-container">
            </div>
        <div class="text-center mt-4">
            <a href="order.html" class="btn btn-outline-primary">Lihat Semua Produk</a>
        </div>
    </div>

    <hr>

    <div data-aos="fade-up">
        <h2>Testimoni Pelanggan</h2>
        <div id="testimoniContainer"></div>
    </div>
    
    <hr id="faq-section">
    
    <div data-aos="fade-up">
        <h2>Ada Pertanyaan?</h2>
        <div class="section-container" id="faq-container"></div>
    </div>
    
    <hr id="cek-status-section">
    
    <div data-aos="fade-up" class="section-container">
        <h2>Cek Status Pesanan Anda</h2>
        <form onsubmit="event.preventDefault(); window.location.href = `status.html?id=${document.getElementById('idCek').value.trim()}`;">
            <label for="idCek">Masukkan ID Pesanan Anda</label>
            <input type="text" id="idCek" placeholder="Cth: P16789..." required />
            <button type="submit">Cek Status</button>
        </form>
    </div>
</main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true, offset: 50 });

    // === KONFIGURASI FIREBASE ===
    const firebaseConfig = {
      apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
      authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
      databaseURL: "https://asdarstoredigitalll-d89c4-default-rtdb.firebaseio.com",
      projectId: "asdarstoredigitalll-d89c4",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const dbFS = firebase.firestore();
    const dbRT = firebase.database();
    
    const userPanel = document.getElementById('user-panel');
    const formatRupiah = (angka) => `Rp${(angka || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".")}`;

    // === EVENT LISTENER & AUTENTIKASI ===
    document.addEventListener('DOMContentLoaded', () => {
      loadInitialData();
    });

    auth.onAuthStateChanged(async user => {
        if (user) {
            const resellerRef = dbFS.collection('resellers').doc(user.uid);
            userPanel.innerHTML = ''; // Clear previous buttons
            try {
                const resellerDoc = await resellerRef.get();
                if (resellerDoc.exists && resellerDoc.data().status === 'active') {
                    userPanel.innerHTML += `<a href="reseller-dashboard.html" class="dashboard-btn"><i class="fas fa-tachometer-alt"></i> Dashboard</a>`;
                } else {
                    userPanel.innerHTML += `<a href="reseller.html" class="dashboard-btn"><i class="fas fa-user-tie"></i> Jadi Seller</a>`;
                }
                userPanel.innerHTML += `<a href="#" onclick="event.preventDefault(); auth.signOut();" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>`;
            } catch (error) {
                userPanel.innerHTML = `<a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login/Daftar</a>`;
            }
        } else {
            userPanel.innerHTML = `<a href="login.html" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login/Daftar</a>`;
        }
    });

    // === FUNGSI PEMUATAN DATA AWAL ===
    function loadInitialData() {
        loadAndDisplayBanners();
        loadProductCategories(); // **BARU**
        loadPopularProducts();
        loadAndRenderFaq();
        loadApprovedTestimonials();
    }

    async function loadProductCategories() {
        const container = document.getElementById('kategori-container');
        container.innerHTML = '<p class="text-center w-100">Memuat kategori...</p>';
        try {
            const snapshot = await dbFS.collection('produk').get();
            if (snapshot.empty) {
                container.innerHTML = '<p class="text-center w-100">Kategori tidak ditemukan.</p>';
                return;
            }

            const categoryIcons = {
                'TOPUP GAME': 'fa-gamepad',
                'PULSA': 'fa-mobile-alt',
                'PAKET DATA': 'fa-wifi',
                'TOKEN LISTRIK': 'fa-bolt',
                'E-WALLET': 'fa-wallet',
                'VOUCHER': 'fa-ticket-alt',
                'AKUN PREMIUM': 'fa-star',
                'DEFAULT': 'fa-tags'
            };

            const categories = new Set();
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.kategori) categories.add(data.kategori);
            });

            let categoriesHTML = '';
            categories.forEach(category => {
                const encodedCategory = encodeURIComponent(category);
                const iconClass = categoryIcons[category.toUpperCase()] || categoryIcons['DEFAULT'];
                categoriesHTML += `
                    <a href="order.html?kategori=${encodedCategory}" class="kategori-item">
                        <i class="fas ${iconClass}"></i>
                        <span>${category}</span>
                    </a>
                `;
            });
            container.innerHTML = categoriesHTML || '<p class="text-center w-100">Tidak ada kategori untuk ditampilkan.</p>';
        } catch (error) {
            console.error("Gagal memuat kategori:", error);
            container.innerHTML = '<p class="text-center w-100 text-danger">Gagal memuat kategori produk.</p>';
        }
    }

    async function loadAndDisplayBanners() {
        const bannerContainer = document.getElementById('banner-container');
        try {
            const snapshot = await dbFS.collection('banners').orderBy('urutan').get();
            if (snapshot.empty) return;
            let bannersHTML = '';
            snapshot.forEach(doc => {
                const banner = doc.data();
                const imgTag = `<img src="${banner.url}" alt="Banner Promosi" class="banner-image">`;
                bannersHTML += banner.link ? `<a href="${banner.link}" target="_blank" class="banner-item">${imgTag}</a>` : `<div class="banner-item">${imgTag}</div>`;
            });
            bannerContainer.innerHTML = bannersHTML;
        } catch (error) { console.error("Gagal memuat banner:", error); }
    }
    
    async function loadPopularProducts() {
        const container = document.getElementById('produk-populer-container');
        container.innerHTML = '<p>Memuat produk...</p>';
        try {
            const snapshot = await dbFS.collection('produk').where('stok', '>', 0).orderBy('stok').limit(4).get();
            if (snapshot.empty) { container.innerHTML = '<p>Produk populer belum tersedia.</p>'; return; }
            
            let productsHTML = '';
            snapshot.forEach(doc => {
                const product = doc.data();
                productsHTML += `
                    <a href="order.html?produk=${doc.id}" class="product-card text-decoration-none">
                        <div class="product-card-content">
                            <h3 class="product-card-title text-body">${product.nama_produk}</h3>
                            <p class="product-card-price">${formatRupiah(product.harga_umum)}</p>
                        </div>
                        <div class="product-card-button">Beli Sekarang</div>
                    </a>
                `;
            });
            container.innerHTML = productsHTML;
        } catch (error) {
            console.error("Gagal memuat produk populer:", error);
            container.innerHTML = '<p class="text-danger">Gagal memuat produk.</p>';
        }
    }

    function loadAndRenderFaq() {
        const faqContainer = document.getElementById('faq-container');
        dbRT.ref('faq').once('value').then(snap => {
            if (!snap.exists()) { faqContainer.innerHTML = `<p class="text-center text-muted">FAQ tidak tersedia.</p>`; return; }
            faqContainer.innerHTML = '';
            snap.forEach(itemSnap => {
                const itemData = itemSnap.val();
                const item = document.createElement('div');
                item.className = 'faq-item';
                item.innerHTML = `<div class="faq-question">${itemData.q}</div><div class="faq-answer">${itemData.a}</div>`;
                faqContainer.appendChild(item);
                item.querySelector('.faq-question').addEventListener('click', () => item.classList.toggle('active'));
            });
        }).catch(err => { console.error("Gagal memuat FAQ:", err); });
    }

    function loadApprovedTestimonials() {
        const container = document.getElementById('testimoniContainer');
        dbRT.ref('testimonials').orderByChild('status').equalTo('disetujui').once('value', snap => {
            if (!snap.exists()) { container.innerHTML = `<p style="text-align:center; padding-top:20px;">Jadilah yang pertama memberi testimoni!</p>`; return; }
            container.innerHTML = '';
            let testimonials = [];
            snap.forEach(childSnap => { testimonials.push(childSnap.val()); });
            testimonials.reverse().slice(0, 10).forEach(testi => { // Tampilkan maks 10
                const bubble = document.createElement('div');
                bubble.className = 'testimonial-bubble';
                bubble.innerHTML = `<div class="testimonial-header"><i class="fas fa-user-circle"></i><span class="testimonial-name">${testi.nama || 'Anonim'}</span></div><div class="testimonial-body">${testi.isi || ''}</div>`;
                container.appendChild(bubble);
            });
        });
    }

  </script>
</body>
</html>
