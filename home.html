<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asdar Store Digital - Modern Design</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    /* === GLASSMORPHISM THEME === */
    :root {
      --primary-color: #8e44ad;
      --secondary-color: #3498db;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --text-color: #ffffff;
      --muted-text-color: #bdc3c7;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      color: var(--text-color);
      transition: background 0.5s ease;
      margin: 0;
      line-height: 1.6;
      background-attachment: fixed;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      z-index: 999;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-color);
      text-shadow: 0 1px 3px var(--shadow);
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    label {
      font-weight: 600;
      margin-top: 15px;
      margin-bottom: 8px;
      display: block;
      color: var(--text-color);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background-color: var(--glass-bg);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    
    input::placeholder, textarea::placeholder {
      color: var(--muted-text-color);
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
    }

    button, .reseller-btn, .dashboard-btn, .all-products-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      margin-top: 10px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .all-products-btn, .reseller-btn { font-size: 0.9em; padding: 10px 16px; }

    button:hover, .reseller-btn:hover, .dashboard-btn:hover, .all-products-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      filter: brightness(1.1);
    }
    
    button:disabled {
      background: #95a5a6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .info {
      background: var(--glass-bg);
      padding: 20px;
      margin-top: 1rem;
      border-left: 5px solid var(--primary-color);
      border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .section-container {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
      border: 1px solid var(--glass-border);
      margin-top: 25px;
    }

    hr {
      margin: 40px 0;
      border: 0;
      border-top: 1px solid var(--glass-border);
    }

    h2 {
      color: var(--text-color);
      margin-top: 30px;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 700;
      text-shadow: 0 1px 3px var(--shadow);
    }
    
    .kategori-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .kategori-item {
      text-align: center;
      background: var(--glass-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 12px;
      padding: 10px;
      border: 2px solid transparent;
      box-shadow: 0 2px 4px var(--shadow);
      cursor: pointer;
      transition: all 0.2s;
    }

    .kategori-item:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }
    
    .kategori-item.active {
      border-color: var(--primary-color);
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(142, 68, 173, 0.7);
    }

    .kategori-item img, .kategori-item p {
      pointer-events: none; /* Penting agar klik tetap terdeteksi di parent-nya */
    }
    
    .kategori-item img {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }

    .kategori-item p {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-color);
    }

    /* Sisa CSS tidak berubah */

  </style>
</head>

<body>
<header id="header">
    <div class="header-left">
        <h1>Asdar Store</h1>
    </div>
    <div class="header-right">
        <a href="daftar-produk.html" class="all-products-btn">
            <i class="fas fa-list"></i> Lihat Semua Produk
        </a>
        <div id="user-panel">
            <a href="login.html" class="reseller-btn"><i class="fas fa-sign-in-alt"></i><span>Login/Daftar</span></a>
        </div>
    </div>
</header>
  
<main id="main-content">
    <div id="banner-container" data-aos="fade-down"></div>
    <div id="custom-html-container"></div>
    
    <div data-aos="fade-up" class="section-container" id="order-form-container">
      <h2 style="margin-top:0;">Formulir Pemesanan</h2>
      <div id="existing-order-notification" style="display: none;"></div>
      <form id="formPesanan">

        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Cth: Budi Santoso" required />
        <label for="nomor">Nomor HP / ID Game/ ID Pelanggan</label>
        <input type="text" id="nomor" placeholder="Cth: 081234567890 atau ID Anda" required />
        <label for="waAktif">Nomor WhatsApp Aktif</label>
        <input type="tel" id="waAktif" placeholder="Cth: 081234567890 (awali 08...)" pattern="^08[0-9]{8,15}$" required />
        
        <label>Kategori Produk</label>
        <div id="kategori-grid-form" class="kategori-container">
            </div>
        <input type="hidden" id="kategori-terpilih" required>

        <label for="produk">Produk</label>
        <select id="produk" required>
            <option value="">Pilih Kategori Terlebih Dahulu</option>
        </select>
        <div id="product-promo-container"></div>
        <div class="info" id="infoProduk" style="min-height: 80px;">Pilih kategori dan produk untuk melihat detail.</div>
        <button type="button" id="nextToPaymentBtn" disabled>Lanjut ke Pembayaran</button>
      </form>
    </div>

    </main>

        }

        document.getElementById('formTestimoni').addEventListener('submit', handleTestimoniSubmit);

    // ... (Fungsi-fungsi lain seperti cekDanTerapkanDiskonOtomatis, dll tidak perlu diubah) ...
    
    // [MODIFIKASI] Fungsi loadInitialData
    function loadInitialData() {
        const kategoriGridContainer = document.getElementById('kategori-grid-form');
        kategoriGridContainer.innerHTML = '<p style="text-align:center; width:100%;">Memuat kategori...</p>';

        dbFS.collection('produk').orderBy('kategori').get().then(snapshot => {
            const categories = new Set();
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.kategori) {
                    categories.add(data.kategori);
                }
            });

            let gridHTML = '';
            categories.forEach(kategori => {
                const ikonHuruf = kategori.charAt(0).toUpperCase();
                gridHTML += `
                    <div class="kategori-item" data-kategori="${kategori}">
                        <img src="https://via.placeholder.com/50/FFFFFF/2c3e50?text=${ikonHuruf}" alt="${kategori}">
                        <p>${kategori}</p>
                    </div>
                `;
            });
            kategoriGridContainer.innerHTML = gridHTML;
        });
        
        // Fungsi lain tetap dipanggil seperti biasa
        // loadAndDisplayBanners();
        // loadAndRenderFaq();
        // loadApprovedTestimonials();
    }
    
    // [MODIFIKASI] Fungsi handleCategoryChange
    function handleCategoryChange(kategoriNama) {
        resetFormState(); // Fungsi ini tetap berguna untuk mereset info produk
        const produkSelect = document.getElementById('produk');
        const kategoriTerpilihInput = document.getElementById('kategori-terpilih');

        if (!kategoriNama) {
            produkSelect.innerHTML = '<option value="">Pilih Kategori Terlebih Dahulu</option>';
            kategoriTerpilihInput.value = '';
            return;
        }
        
        kategoriTerpilihInput.value = kategoriNama;
        produkSelect.innerHTML = '<option value="">Memuat produk...</option>';
        produkSelect.disabled = false;

        dbFS.collection('produk').where('kategori', '==', kategoriNama).orderBy('urutan').get().then(snapshot => {
            const products = [];
            snapshot.forEach(doc => {
                products.push({ id: doc.id, ...doc.data() });
            });
            
            produkSelect.innerHTML = '<option value="">Pilih Produk</option>';
            products.forEach(prod => {
                produkSelect.innerHTML += `<option value="${prod.id}">${prod.nama_produk}</option>`;
            });
        });
    }

    // Sisa fungsi JavaScript Anda (handleProductSelection, resetFormState, dll) tidak perlu diubah.

  </script>
</body>
</html>
