<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asdar Store Digital - Grid Design</title>
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    /* === GLASSMORPHISM THEME (SAMA SEPERTI SEBELUMNYA) === */
    :root {
      --primary-color: #8e44ad;
      --secondary-color: #3498db;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --text-color: #ffffff;
      --muted-text-color: #bdc3c7;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      color: var(--text-color);
      transition: background 0.5s ease;
      margin: 0;
      line-height: 1.6;
      background-attachment: fixed;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      z-index: 999;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-color);
      text-shadow: 0 1px 3px var(--shadow);
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    label {
      font-weight: 600;
      margin-top: 15px;
      display: block;
      color: var(--text-color);
    }
    /* Sembunyikan label untuk dropdown kategori asli */
    label[for="kategori"] {
        display: none;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background-color: var(--glass-bg);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    /* Sembunyikan dropdown kategori asli */
    select#kategori {
        display: none;
    }

    input::placeholder, textarea::placeholder {
      color: var(--muted-text-color);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--secondary-color);
      box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
    }

    button, .reseller-btn, .dashboard-btn, .all-products-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      margin-top: 10px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .all-products-btn { font-size: 0.9em; padding: 10px 16px; }
    .reseller-btn { font-size: 0.9em; padding: 10px 16px; }

    button:hover, .reseller-btn:hover, .dashboard-btn:hover, .all-products-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      filter: brightness(1.1);
    }
    button:disabled {
      background: #95a5a6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .info {
      background: var(--glass-bg);
      padding: 20px;
      margin-top: 1rem;
      border-left: 5px solid var(--primary-color);
      border-radius: 12px;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .section-container {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
      border: 1px solid var(--glass-border);
      margin-top: 25px;
    }

    hr {
      margin: 40px 0;
      border: 0;
      border-top: 1px solid var(--glass-border);
    }

    h2 {
      color: var(--text-color);
      margin-top: 30px;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 700;
      text-shadow: 0 1px 3px var(--shadow);
    }

    /* === BARU: CSS UNTUK GRID KATEGORI === */
    .category-grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 15px;
        margin-top: 15px;
        margin-bottom: 15px;
    }
    .category-item {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 15px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .category-item:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.2);
        border-color: var(--secondary-color);
    }
    .category-item.selected {
        background: var(--primary-color);
        border-color: var(--secondary-color);
        color: white;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        transform: translateY(-2px);
    }
    .category-item i {
        font-size: 2.2em;
        margin-bottom: 10px;
        display: block;
        color: var(--secondary-color);
        transition: color 0.3s ease;
    }
    .category-item.selected i {
        color: white;
    }
    .category-item span {
        font-size: 0.9em;
        font-weight: 500;
        display: block;
    }
    /* === AKHIR DARI CSS BARU === */

    #testimoniContainer {
      background: transparent; border-radius: 12px; padding: 15px; height: 350px; overflow-y: auto; border: none; display: flex; flex-direction: column; gap: 1rem;
    }
    .testimonial-bubble {
      background-color: rgba(0,0,0,0.15); color: var(--text-color); padding: 15px 20px; border-radius: 20px; max-width: 85%; align-self: flex-start; box-shadow: 0 4px 8px rgba(0,0,0,0.1); opacity: 0; animation: slideInUp 0.6s ease-out forwards; border: 1px solid rgba(255,255,255,0.1);
    }
    .testimonial-header { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; }
    .testimonial-header .fa-user-circle { font-size: 1.4em; color: var(--secondary-color); }
    .testimonial-name { font-weight: 700; font-size: 1em; }
    .testimonial-body { font-size: 0.95em; line-height: 1.5; color: var(--muted-text-color); padding-left: 2px; }
    @keyframes slideInUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .faq-item { border-bottom: 1px solid var(--glass-border); padding: 18px 0; }
    .faq-item:last-child { border-bottom: none; }
    .faq-question { cursor: pointer; font-weight: 600; font-size: 1.1em; display: flex; justify-content: space-between; align-items: center; }
    .faq-question::after { content: '▼'; font-size: 12px; transition: transform 0.3s ease; color: var(--secondary-color); }
    .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding-top 0.3s ease; padding-top: 0; color: var(--muted-text-color); }
    .faq-item.active .faq-answer { padding-top: 15px; max-height: 999px; }
    .faq-item.active .faq-question::after { transform: rotate(180deg); }
    .notification { padding: 15px; margin-bottom: 15px; border-radius: 8px; font-weight: 600; display: none; text-align: center; }
    .notification.info { background-color: rgba(52, 152, 219, 0.8); color: white; }
    .notification.success { background-color: rgba(46, 204, 113, 0.8); color: white; }
    .notification.error { background-color: rgba(231, 76, 60, 0.8); color: white; }
    #banner-container { width: 100%; margin-bottom: 20px; }
    .banner-item { display: block; margin-bottom: 10px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    .banner-image { width: 100%; display: block; vertical-align: middle; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .payment-option input[type="radio"] { display: none; }
    .payment-option label { display: block; padding: 15px 20px; border: 2px solid var(--glass-border); background: rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; transition: all 0.2s ease-in-out; font-weight: 600; margin-top: 10px; }
    .payment-option label:hover { border-color: var(--secondary-color); background: rgba(255,255,255,0.1); }
    .payment-option input[type="radio"]:checked + label { background: var(--primary-color); border-color: var(--primary-color); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    .payment-content { border: 1px solid var(--glass-border); padding: 20px; margin-top: 15px; border-radius: 12px; background: rgba(0,0,0,0.1); }
    .hidden { display: none; }
    #existing-order-notification { padding: 20px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #f39c12; background-color: rgba(243, 156, 18, 0.2); backdrop-filter: blur(5px); color: #f1c40f; font-size: 0.95em; line-height: 1.6; }
    #existing-order-notification button { background: var(--danger-color); color: white; padding: 8px 12px; font-size: 0.9em; margin-top: 10px; width: auto; }
    .qris-details { text-align: center; padding: 15px; }
    .qris-image { max-width: 250px; width: 100%; height: auto; margin-bottom: 10px; border-radius: 8px; background: white; padding: 10px;}
    .payment-method-item { background-color: rgba(0,0,0,0.1); border: 1px solid var(--glass-border); border-radius: 12px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .payment-method-name { font-weight: 600; font-size: 1.1em; }
    .payment-method-number { font-size: 1em; font-weight: 500; color: var(--secondary-color); }
    .payment-method-an { font-size: 0.85em; color: var(--muted-text-color); }
    .copy-btn { background-color: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: var(--muted-text-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; font-size: 0.9em; }
    .copy-btn:hover { background-color: var(--secondary-color); color: white; border-color: var(--secondary-color); }
    .copy-btn:disabled { background-color: var(--success-color) !important; color: white !important; border-color: var(--success-color) !important; }

  </style>
</head>

<body>
<header id="header"></header>
  
<main id="main-content">
    <div id="banner-container" data-aos="fade-down"></div>
    <div id="custom-html-container"></div>
    
    <div data-aos="fade-up" class="section-container" id="order-form-container">
      <h2 style="margin-top:0;">Formulir Pemesanan</h2>
      <div id="existing-order-notification" style="display: none;"></div>
      <form id="formPesanan">
        <div id="formNotification" class="notification"></div>
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Cth: Budi Santoso" required />
        <label for="nomor">Nomor HP / ID Game/ [SN/ID]DIGITAL</label>
        <input type="text" id="nomor" placeholder="Cth: 081234567890 atau ID Anda" required />
        <label for="waAktif">Nomor WhatsApp Aktif</label>
        <input type="tel" id="waAktif" placeholder="Cth: 081234567890 (awali 08...)" pattern="^08[0-9]{8,15}$" required />
        
        <label>Kategori Produk</label>
        <div id="kategori-grid" class="category-grid-container">
            </div>
        
        <select id="kategori" required></select>

        <div id="produk-container" style="display: none;">
            <label for="produk">Produk</label>
            <select id="produk" required><option value="">Pilih Produk</option></select>
        </div>
        <div id="product-promo-container"></div>
        <div class="info" id="infoProduk" style="min-height: 80px;">Pilih kategori untuk memulai.</div>
        <button type="button" id="nextToPaymentBtn" disabled>Lanjut ke Pembayaran</button>
      </form>
    </div>

    </main>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 800, once: true, offset: 50 });

    const firebaseConfig = {
      apiKey: "AIzaSyA_L6U3HKM1DnKuq_Q1zKFH4bk8GMAz210",
      authDomain: "asdarstoredigitalll-d89c4.firebaseapp.com",
      databaseURL: "https://asdarstoredigitalll-d89c4-default-rtdb.firebaseio.com",
      projectId: "asdarstoredigitalll-d89c4",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const dbFS = firebase.firestore();
    const dbRT = firebase.database();
    
    // ... Variabel Global & Elemen DOM (sama) ...
    let currentUser = null; 
    const userPanel = document.getElementById('user-panel');
    let produkTerpilihData = null;
    let promoProdukTerpakai = false;
    let diskonPromoTerpakai = false; 
    let pendingOrderData = {}; 
    const orderFormFields = {
        nama: document.getElementById('nama'),
        nomor: document.getElementById('nomor'),
        waAktif: document.getElementById('waAktif'),
        kategori: document.getElementById('kategori'),
        produk: document.getElementById('produk'),
        nextBtn: document.getElementById('nextToPaymentBtn')
    };
    const infoProduk = document.getElementById('infoProduk');
    const produkContainer = document.getElementById('produk-container');

    // === BARU: Pemetaan Ikon untuk Kategori ===
    const categoryIcons = {
        'PULSA': 'fas fa-mobile-alt',
        'TOKEN LISTRIK': 'fas fa-bolt',
        'E-WALLET': 'fas fa-wallet',
        'VOUCHER GAME': 'fas fa-gamepad',
        'PAKET DATA': 'fas fa-wifi',
        // Tambahkan kategori dan ikon lainnya di sini
        'DEFAULT': 'fas fa-tag' // Ikon default jika tidak ada yang cocok
    };

    // ... Semua fungsi utilitas (formatRupiah, dll.) tetap sama ...

    document.addEventListener('DOMContentLoaded', () => {
      loadInitialData();
      checkForLostId();
    });

    // ... auth.onAuthStateChanged tetap sama ...
    
    // === FUNGSI UTAMA YANG DIMODIFIKASI ===

    function loadInitialData() {
        const kategoriGrid = document.getElementById('kategori-grid');

        dbFS.collection('produk').get().then(snapshot => {
            const categories = new Set();
            snapshot.forEach(doc => {
                const data = doc.data();
                if (data.kategori) {
                    categories.add(data.kategori);
                }
            });

            // 1. Kosongkan dropdown & grid
            orderFormFields.kategori.innerHTML = '<option value=""></option>';
            kategoriGrid.innerHTML = '';

            // 2. Isi dropdown (yang tersembunyi) dan buat grid visual
            categories.forEach(kategori => {
                // Isi dropdown asli
                orderFormFields.kategori.innerHTML += `<option value="${kategori}">${kategori}</option>`;

                // Buat item untuk grid visual
                const iconClass = categoryIcons[kategori.toUpperCase()] || categoryIcons['DEFAULT'];
                const gridItem = document.createElement('div');
                gridItem.className = 'category-item';
                gridItem.dataset.kategori = kategori;
                gridItem.innerHTML = `<i class="${iconClass}"></i><span>${kategori}</span>`;
                
                // Tambahkan event listener ke setiap item grid
                gridItem.addEventListener('click', () => {
                    // Hapus kelas 'selected' dari semua item
                    document.querySelectorAll('.category-item').forEach(item => item.classList.remove('selected'));
                    // Tambahkan kelas 'selected' ke item yang diklik
                    gridItem.classList.add('selected');

                    // Set nilai dropdown tersembunyi
                    orderFormFields.kategori.value = kategori;
                    // Picu event 'change' pada dropdown tersembunyi untuk menjalankan logika yang ada
                    orderFormFields.kategori.dispatchEvent(new Event('change'));
                });

                kategoriGrid.appendChild(gridItem);
            });
        });

        loadAndDisplayBanners();
        loadAndRenderFaq();
        loadApprovedTestimonials();
    }

    function handleCategoryChange() {
        resetFormState();
        const kategori = orderFormFields.kategori.value;

        if (!kategori) {
            produkContainer.style.display = 'none'; // Sembunyikan dropdown produk jika tidak ada kategori
            return;
        };

        produkContainer.style.display = 'block'; // Tampilkan dropdown produk
        orderFormFields.produk.innerHTML = '<option value="">Memuat produk...</option>';

        dbFS.collection('produk').where('kategori', '==', kategori).get().then(snapshot => {
            const products = [];
            if (snapshot.empty) {
                orderFormFields.produk.innerHTML = '<option value="">Produk tidak ditemukan</option>';
                return;
            }
            snapshot.forEach(doc => {
                const data = doc.data();
                products.push({ id: doc.id, ...data });
            });
            products.sort((a, b) => (a.urutan || 0) - (b.urutan || 0));
            
            orderFormFields.produk.innerHTML = '<option value="">Pilih Produk</option>';
            products.forEach(prod => {
                orderFormFields.produk.innerHTML += `<option value="${prod.id}">${prod.nama_produk}</option>`;
            });
        });
    }

    function resetFormState() {
        produkTerpilihData = null;
        promoProdukTerpakai = false;
        resetSemuaDiskon();
        infoProduk.innerHTML = 'Pilih produk untuk melihat detail.'; // Pesan setelah kategori dipilih
        orderFormFields.nextBtn.disabled = true;
        orderFormFields.nextBtn.textContent = 'Pilih Produk Dahulu';
        document.getElementById('product-promo-container').innerHTML = '';
        hideNotification();
    }

    // ... SISA SEMUA FUNGSI JAVASCRIPT LAINNYA TETAP SAMA SEPERTI SEBELUMNYA ...
    // (handleProductSelection, updateTotalHarga, cekStatus, dll.)

    // Pastikan event listener untuk `kategori` tetap ada
    orderFormFields.kategori.addEventListener('change', handleCategoryChange);
    orderFormFields.produk.addEventListener('change', handleProductSelection);

  </script>
</body>
</html>
